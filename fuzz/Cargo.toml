[package]
name = "sm-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sm-core = { path = "../crates/sm-core", version = "=0.0.1" }
sm-relay = { path = "../crates/sm-relay", version = "=0.0.1" }

[[bin]]
name = "message_decode"
path = "fuzz_targets/message_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keystore_record"
path = "fuzz_targets/keystore_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relay_frame"
path = "fuzz_targets/relay_frame.rs"
test = false
doc = false
bench = false

# Отдельный workspace: fuzz собирается на nightly и не входит в основную сборку.
[workspace]

[[bin]]
name = "chunk_reassemble"
path = "fuzz_targets/chunk_reassemble.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_restore"
path = "fuzz_targets/store_restore.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relay_http"
path = "fuzz_targets/relay_http.rs"
test = false
doc = false
bench = false

[[bin]]
name = "node_record"
path = "fuzz_targets/node_record.rs"
test = false
doc = false
bench = false
