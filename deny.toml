# cargo-deny: уязвимости, лицензии, источники, дубликаты (ADR-15, ADR-20).
[graph]
all-features = true

[advisories]
# Любая запись RustSec (уязвимость, unmaintained, unsound, yanked) — ошибка.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Разрешённые лицензии зависимостей. Новая лицензия — только через PR с объяснением.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "AGPL-3.0-only", "AGPL-3.0-or-later"]
confidence-threshold = 0.9
unused-allowed-license = "allow"
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Своя криптография запрещена (ADR-1): примитивы — только через libsignal / OpenMLS.
# Это главная проверка: cargo deny смотрит реальный граф зависимостей, обойти её записью
# Cargo.toml нельзя (в отличие от semgrep sm-no-crypto-dependency — там тот же список).
# Когда подключим libsignal / OpenMLS (или rustls), их добавляем в wrappers нужного крейта
# через ADR: wrappers разрешают только прямую зависимость от обёртки.
deny = [
  { name = "aes", reason = "ADR-1" },
  { name = "aes-gcm", reason = "ADR-1" },
  { name = "aes-gcm-siv", reason = "ADR-1" },
  { name = "aes-siv", reason = "ADR-1" },
  { name = "aead", reason = "ADR-1" },
  { name = "chacha20", reason = "ADR-1" },
  { name = "chacha20poly1305", reason = "ADR-1" },
  { name = "xsalsa20poly1305", reason = "ADR-1" },
  { name = "salsa20", reason = "ADR-1" },
  { name = "crypto_box", reason = "ADR-1" },
  { name = "crypto_secretbox", reason = "ADR-1" },
  { name = "sha1", reason = "ADR-1" },
  { name = "sha-1", reason = "ADR-1" },
  { name = "sha2", reason = "ADR-1" },
  { name = "sha3", reason = "ADR-1" },
  { name = "md5", reason = "ADR-1" },
  { name = "md-5", reason = "ADR-1" },
  { name = "hmac", reason = "ADR-1" },
