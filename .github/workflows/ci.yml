# Конвейер проверки (шаг 0 плана MVP; ADR-15, ADR-20, ADR-26).
# Действия закреплены по SHA коммита (защита от подмены тегов). Обновлять — PR с новыми SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# ADR-52: прогон на каждый коммит, коммит вердикта не отменяет прогон кода (минуты бесплатны, ADR-51).
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ADR-27: push в main только с документацией — тяжёлые задачи пропускаются, остаётся docs.
  # ADR-52 (заменил ADR-28): в PR полный прогон на каждый push, в том числе с одними вердиктами;
  # wait всегда false и оставлен для совместимости условий.
  # Ошибка этой задачи роняет ci-ok (зависимые задачи — skipped, сама — failure).
  changes:
    name: Что изменилось (код или только документация)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      wait: ${{ steps.diff.outputs.wait }}
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          wait=false
          # Документация: wiki/, design/, memory/ и *.md в корне. Всё остальное — код.
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --no-renames --name-only "$BEFORE" "$SHA")
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(wiki/|design/|memory/)|^[^/]+\.md$'; then code=false; fi
          fi
          # ADR-48: APK собирается только в PR, где изменены приложение, ядро или их сборка.
          android=false
          if [ "$EVENT" = pull_request ] && git diff --no-renames --name-only "$BASE...$HEAD" | grep -qE '^(android/|crates/|tools/uniffi-bindgen/|Cargo\.(toml|lock)$|rust-toolchain|scripts/(build-android-core|fetch-protoc)\.sh$|\.github/workflows/ci\.yml$)'; then android=true; fi
          { echo "code=$code"; echo "android=$android"; echo "wait=$wait"; } >> "$GITHUB_OUTPUT"
          echo "Изменён код: $code; ждём ревью: $wait; сборка APK: $android"

  rust:
    name: rustfmt · clippy · тесты
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # libsignal собирается с protoc (ADR-55 п.4): закреплённый релиз, проверка sha256.
      - run: |
          protoc="$(bash scripts/fetch-protoc.sh)"
          echo "PROTOC=$protoc" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  supply-chain:
    name: cargo-deny · cargo-audit · cargo-vet · OSV-Scanner
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-vet@0.10.0,osv-scanner@2.6.0
      - run: cargo deny --locked check
      # fuzz/ — отдельный workspace: те же запреты [bans] (ADR-1) по его графу зависимостей.
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check bans
      - run: cargo audit --deny warnings
      - run: cargo audit --deny warnings --file fuzz/Cargo.lock
      # tools/uniffi-bindgen/ — генератор привязок (ADR-46), отдельный workspace: те же проверки, что у fuzz/.
      - run: cargo deny --manifest-path tools/uniffi-bindgen/Cargo.toml --config deny.toml --locked check bans
      - run: cargo audit --deny warnings --file tools/uniffi-bindgen/Cargo.lock
      - run: cargo vet --locked
      # Один конфиг на все Cargo.lock: иначе OSV ищет его рядом с каждым (fuzz/ тоже тянет libcrux).
      - run: osv-scanner scan source --recursive --config osv-scanner.toml .

  semgrep:
    name: Semgrep (свои правила + p/rust + p/kotlin)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Списки запрещённой криптографии согласованы (deny.toml и правила semgrep)
        run: node scripts/check-crypto-bans.mjs
      - run: pipx install semgrep==1.180.0
      - run: semgrep scan --config .semgrep/ --config p/rust --config p/kotlin --error --metrics=off .

  # ADR-52: цели фаззинга — параллельно, список — из fuzz/Cargo.toml (новая цель попадает сама).
  fuzz-targets:
    name: Список целей фаззинга
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: list
        run: |
          list=$(awk '/^\[\[bin\]\]/{b=1;next} b&&/^name *=/{gsub(/.*= *"|".*/,"");print;b=0}' fuzz/Cargo.toml | jq -Rnc '[inputs|select(length>0)]')
          n=$(jq length <<<"$list")
          f=$(find fuzz/fuzz_targets -maxdepth 1 -name '*.rs' | wc -l)
          [ "$n" -gt 0 ] || { echo "::error::нет целей фаззинга"; exit 1; }
          [ "$n" -eq "$f" ] || { echo "::error::целей в fuzz/Cargo.toml: $n, файлов в fuzz/fuzz_targets: $f"; exit 1; }
          echo "Цели: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Фаззинг ${{ matrix.target }} (120 с)
    needs: [changes, fuzz-targets]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install nightly-2026-10-08 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - run: cargo +nightly-2026-10-08 install cargo-fuzz --version 0.13.2 --locked
      - name: Цель — 120 секунд
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +nightly-2026-10-08 fuzz run "$TARGET" -- -max_total_time=120

  docs:
    name: Линт базы знаний (SEK)
    needs: changes
    if: needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: node scripts/sek-lint.mjs

  # ИИ-ревью в PR нет (ADR-53, решение владельца 2026-10-10): только ручное, на релизах —
  # 4 модели × 2 прогона. Проверка вердиктов релиза в CI — отдельным PR (ADR-54 п.8).

  # ADR-79: detekt — правила про ошибки в Kotlin (наборы и исключения — android/detekt.yml).
  # CLI-jar с закреплённой sha256 вместо плагина Gradle: без новых зависимостей сборки.
  # Без разрешения типов (classpath нет) — правила, которым нужны типы, не работают.
  detekt:
    name: detekt (Kotlin)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DETEKT_VERSION: 1.23.8
      DETEKT_SHA256: 2ce2ff952e150baf28a29cda70a363b0340b3e81a55f43e51ec5edffc3d066c1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: '17' }
      - run: |
          curl -sSfL -o "$RUNNER_TEMP/detekt.jar" "https://github.com/detekt/detekt/releases/download/v$DETEKT_VERSION/detekt-cli-$DETEKT_VERSION-all.jar"
          echo "$DETEKT_SHA256  $RUNNER_TEMP/detekt.jar" | sha256sum -c -
          java -jar "$RUNNER_TEMP/detekt.jar" --input android/app/src --config android/detekt.yml --build-upon-default-config --all-rules

  # ADR-79: workflows — actionlint (синтаксис, выражения, shellcheck в run) и zizmor (уязвимости
  # GitHub Actions: инъекции, утечка токенов, кэш, подмена действий; онлайн-проверки — с токеном).
  workflows:
    name: actionlint · zizmor (workflows)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/al.tgz" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/al.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/al.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - run: pipx install zizmor==1.30.1
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .github/workflows/

  # ADR-45, ADR-46, ADR-48. Задача выполняется всегда (в PR skipped = провал ci-ok), а при
  # android=false завершается успешно без сборки.
  android:
    name: Android APK (ядро arm64 + Compose)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - if: needs.changes.outputs.android != 'true'
        run: echo "Не PR или приложение, ядро и их сборка не менялись — APK не собирается (ADR-48)."
      - if: needs.changes.outputs.android == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - if: needs.changes.outputs.android == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: '17' }
      - if: needs.changes.outputs.android == 'true'
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-37.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - if: needs.changes.outputs.android == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            tools/uniffi-bindgen -> target
      - if: needs.changes.outputs.android == 'true'
        run: bash scripts/build-android-core.sh release
      # Gradle без wrapper-jar в репозитории (бинарники не храним): дистрибутив скачивается здесь
      # и сверяется с закреплённой sha256 (опубликована на services.gradle.org, проверено 2026-10-10).
      # Зависимости проверяются по android/gradle/verification-metadata.xml (sha256).
      - if: needs.changes.outputs.android == 'true'
        env:
          GRADLE_VERSION: 9.8.1
          GRADLE_SHA256: dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
      # Только кэш Gradle; дистрибутив — из шага выше.
      - if: needs.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - if: needs.changes.outputs.android == 'true'
        working-directory: android
        # Android Lint (ADR-64): ошибка lint роняет задачу; исключения — android/app/lint.xml.
        # Тесты JVM (ADR-79 п.1): android/app/src/test, JUnit 4.
        run: gradle --no-daemon assembleDebug lintDebug testDebugUnitTest
      - if: failure() && needs.changes.outputs.android == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sm-lint-report
          path: android/app/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: ignore
      - if: needs.changes.outputs.android == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sm-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  ci-ok:
    name: ci-ok (итог — обязательная проверка)
    if: always()
    needs: [changes, rust, supply-chain, semgrep, detekt, workflows, fuzz-targets, fuzz, android, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Отчёт в PR (агенты читают его через API комментариев)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WAIT: ${{ needs.changes.outputs.wait }}
        run: |
          if [ "$WAIT" = true ]; then
            gh pr comment "$PR" --body "### Конвейер ci: ${SHA:0:7}
          ⏸ CI не запускался (ADR-28): изменены только вердикты, свежих ревью меньше двух. Нужно второе ревью по тому же head — тогда пройдёт полный прогон."
            exit 0
          fi
          {
            echo "### Конвейер ci: ${SHA:0:7}"
            echo
            echo "| Задача | Итог |"
            echo "|---|---|"
            echo "$NEEDS" | python3 -c "import json,sys;[print(f'| {k} | {v[\"result\"]} |') for k,v in json.load(sys.stdin).items()]"
            if echo "$NEEDS" | grep -q '"failure"'; then
              echo
              echo "<details><summary>Последние строки логов упавших шагов</summary>"
              echo
              echo '```'
              for id in $(gh api "repos/$GH_REPO/actions/runs/$RUN/jobs" --jq '.jobs[] | select(.conclusion=="failure") | .id'); do
                echo "=== $(gh api "repos/$GH_REPO/actions/jobs/$id" --jq .name)"
                if curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GH_REPO/actions/jobs/$id/logs" -o job.log 2> job.err; then
                  sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g; s/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' job.log | sed '/Post job cleanup/,$d' | grep -v -E '^[[:space:]]*$|^##\[(group|endgroup)' > job.txt || true
                  { grep -n -E 'error(\[|:)|##\[error\]|FAILED|failed|panicked|БЛОК|Ошибка|❯|❱|попытка [0-9]|ответ [0-9]+ символов|отвергнуты' job.txt | tail -n 40 || true; echo "--- конец шагов:"; tail -n 10 job.txt; } | cut -c1-220
                else
                  echo "лог недоступен: $(head -c 300 job.err)"
                fi
              done
              echo '```'
              echo "</details>"
            fi
          } > report.md
          gh pr comment "$PR" --body-file report.md
      - name: Все проверки зелёные
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          WAIT: ${{ needs.changes.outputs.wait }}
        # changes — всегда success. В PR пропусков нет: skipped = провал (задачу могли выключить условием).
        # skipped допустим только вне PR (push в main с документацией, ADR-27).
        run: |
          if [ "$WAIT" = true ]; then echo "Ждём второе ревью (ADR-28): проверки не запускались — не зелёный."; exit 1; fi
          echo "$NEEDS" | python3 -c "
          import json,os,sys
          pr=os.environ['EVENT']=='pull_request'
          def ok(k,r): return r=='success' or (r=='skipped' and not pr and k!='changes')
          bad={k:v['result'] for k,v in json.load(sys.stdin).items() if not ok(k,v['result'])}
          print('Провалены:',bad) if bad else print('OK'); sys.exit(1 if bad else 0)"
