# Конвейер проверки (шаг 0 плана MVP; ADR-15, ADR-20, ADR-26).
# Действия закреплены по SHA коммита (защита от подмены тегов). Обновлять — PR с новыми SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# ADR-52: прогон на каждый коммит, коммит вердикта не отменяет прогон кода (минуты бесплатны, ADR-51).
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ADR-27: push в main только с документацией — тяжёлые задачи пропускаются, остаётся docs.
  # ADR-52 (заменил ADR-28): в PR полный прогон на каждый push, в том числе с одними вердиктами;
  # wait всегда false и оставлен для совместимости условий.
  # Ошибка этой задачи роняет ci-ok (зависимые задачи — skipped, сама — failure).
  changes:
    name: Что изменилось (код или только документация)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      wait: ${{ steps.diff.outputs.wait }}
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          wait=false
          # Документация: wiki/, design/, memory/ и *.md в корне. Всё остальное — код.
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --no-renames --name-only "$BEFORE" "$SHA")
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(wiki/|design/|memory/)|^[^/]+\.md$'; then code=false; fi
          fi
          # ADR-48: APK собирается только в PR, где изменены приложение, ядро или их сборка.
          android=false
          if [ "$EVENT" = pull_request ] && git diff --no-renames --name-only "$BASE...$HEAD" | grep -qE '^(android/|crates/|tools/uniffi-bindgen/|Cargo\.(toml|lock)$|rust-toolchain|scripts/build-android-core\.sh$|\.github/workflows/ci\.yml$)'; then android=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "wait=$wait" >> "$GITHUB_OUTPUT"
          echo "Изменён код: $code; ждём ревью: $wait; сборка APK: $android"

  rust:
    name: rustfmt · clippy · тесты
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  supply-chain:
    name: cargo-deny · cargo-audit · cargo-vet · OSV-Scanner
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-vet@0.10.0,osv-scanner@2.6.0
      - run: cargo deny --locked check
      # fuzz/ — отдельный workspace: те же запреты [bans] (ADR-1) по его графу зависимостей.
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check bans
      - run: cargo audit --deny warnings
      - run: cargo audit --deny warnings --file fuzz/Cargo.lock
      # tools/uniffi-bindgen/ — генератор привязок (ADR-46), отдельный workspace: те же проверки, что у fuzz/.
      - run: cargo deny --manifest-path tools/uniffi-bindgen/Cargo.toml --config deny.toml --locked check bans
      - run: cargo audit --deny warnings --file tools/uniffi-bindgen/Cargo.lock
      - run: cargo vet --locked
      - run: osv-scanner scan source --recursive .

  semgrep:
    name: Semgrep (свои правила + p/rust)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Списки запрещённой криптографии согласованы (deny.toml и правила semgrep)
        run: node scripts/check-crypto-bans.mjs
      - run: pipx install semgrep==1.180.0
      - run: semgrep scan --config .semgrep/ --config p/rust --error --metrics=off .

  # ADR-52: цели фаззинга — параллельно, список — из fuzz/Cargo.toml (новая цель попадает сама).
  fuzz-targets:
    name: Список целей фаззинга
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: list
        run: |
          list=$(awk '/^\[\[bin\]\]/{b=1;next} b&&/^name *=/{gsub(/.*= *"|".*/,"");print;b=0}' fuzz/Cargo.toml | jq -Rnc '[inputs|select(length>0)]')
          n=$(jq length <<<"$list")
          f=$(ls fuzz/fuzz_targets/*.rs | wc -l)
          [ "$n" -gt 0 ] || { echo "::error::нет целей фаззинга"; exit 1; }
          [ "$n" -eq "$f" ] || { echo "::error::целей в fuzz/Cargo.toml: $n, файлов в fuzz/fuzz_targets: $f"; exit 1; }
          echo "Цели: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Фаззинг ${{ matrix.target }} (120 с)
    needs: [changes, fuzz-targets]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install nightly-2026-10-08 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - run: cargo +nightly-2026-10-08 install cargo-fuzz --version 0.13.2 --locked
      - name: Цель — 120 секунд
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +nightly-2026-10-08 fuzz run "$TARGET" -- -max_total_time=120

  kani:
    name: Kani (доказательства разбора)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install --locked kani-verifier --version 0.68.0
      - run: cargo kani setup
      - run: cargo kani -p sm-core -Z stubbing

  docs:
    name: Линт базы знаний (SEK)
    needs: changes
    if: needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: node scripts/sek-lint.mjs

  ai-review:
    name: ИИ-ревью (ансамбль моделей)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Скрипт ревью из базовой ветки (PR не может подменить проверку)
        run: |
          git show "$BASE_SHA:scripts/ai-review.mjs" > "$RUNNER_TEMP/ai-review.mjs" 2>/dev/null || cp scripts/ai-review.mjs "$RUNNER_TEMP/ai-review.mjs"
          node "$RUNNER_TEMP/ai-review.mjs"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          PR: ${{ github.event.pull_request.number }}

  # ADR-45, ADR-46, ADR-48. Задача выполняется всегда (в PR skipped = провал ci-ok), а при
  # android=false завершается успешно без сборки.
  android:
    name: Android APK (ядро arm64 + Compose)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - if: needs.changes.outputs.android != 'true'
        run: echo "Не PR или приложение, ядро и их сборка не менялись — APK не собирается (ADR-48)."
      - if: needs.changes.outputs.android == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - if: needs.changes.outputs.android == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: '17' }
      - if: needs.changes.outputs.android == 'true'
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-37.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - if: needs.changes.outputs.android == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            tools/uniffi-bindgen -> target
      - if: needs.changes.outputs.android == 'true'
        run: bash scripts/build-android-core.sh release
      # Gradle без wrapper-jar в репозитории (бинарники не храним): версия задана здесь.
      # Зависимости проверяются по android/gradle/verification-metadata.xml (sha256).
      - if: needs.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with: { gradle-version: 9.8.1 }
      - if: needs.changes.outputs.android == 'true'
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - if: needs.changes.outputs.android == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sm-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  ci-ok:
    name: ci-ok (итог — обязательная проверка)
    if: always()
    needs: [changes, rust, supply-chain, semgrep, fuzz-targets, fuzz, kani, android, docs, ai-review]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Отчёт в PR (агенты читают его через API комментариев)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WAIT: ${{ needs.changes.outputs.wait }}
        run: |
          if [ "$WAIT" = true ]; then
            gh pr comment "$PR" --body "### Конвейер ci: ${SHA:0:7}
          ⏸ CI не запускался (ADR-28): изменены только вердикты, свежих ревью меньше двух. Нужно второе ревью по тому же head — тогда пройдёт полный прогон."
            exit 0
          fi
          {
            echo "### Конвейер ci: ${SHA:0:7}"
            echo
            echo "| Задача | Итог |"
            echo "|---|---|"
            echo "$NEEDS" | python3 -c "import json,sys;[print(f'| {k} | {v[\"result\"]} |') for k,v in json.load(sys.stdin).items()]"
            if echo "$NEEDS" | grep -q '"failure"'; then
              echo
              echo "<details><summary>Последние строки логов упавших шагов</summary>"
              echo
              echo '```'
              for id in $(gh api "repos/$GH_REPO/actions/runs/$RUN/jobs" --jq '.jobs[] | select(.conclusion=="failure") | .id'); do
                echo "=== $(gh api "repos/$GH_REPO/actions/jobs/$id" --jq .name)"
                if curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GH_REPO/actions/jobs/$id/logs" -o job.log 2> job.err; then
                  sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g; s/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' job.log | sed '/Post job cleanup/,$d' | grep -v -E '^[[:space:]]*$|^##\[(group|endgroup)' > job.txt || true
                  { grep -n -E 'error(\[|:)|##\[error\]|FAILED|failed|panicked|БЛОК|Ошибка|❯|❱|попытка [0-9]|ответ [0-9]+ символов|отвергнуты' job.txt | tail -n 40 || true; echo "--- конец шагов:"; tail -n 10 job.txt; } | cut -c1-220
                else
                  echo "лог недоступен: $(head -c 300 job.err)"
                fi
              done
              echo '```'
              echo "</details>"
            fi
          } > report.md
          gh pr comment "$PR" --body-file report.md
      - name: Все проверки зелёные
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          WAIT: ${{ needs.changes.outputs.wait }}
        # changes — всегда success. В PR пропусков нет: skipped = провал (задачу могли выключить условием).
        # skipped допустим только вне PR (push в main с документацией, ADR-27).
        run: |
          if [ "$WAIT" = true ]; then echo "Ждём второе ревью (ADR-28): проверки не запускались — не зелёный."; exit 1; fi
          echo "$NEEDS" | python3 -c "
          import json,os,sys
          pr=os.environ['EVENT']=='pull_request'
          def ok(k,r): return r=='success' or (r=='skipped' and not pr and k!='changes')
          bad={k:v['result'] for k,v in json.load(sys.stdin).items() if not ok(k,v['result'])}
          print('Провалены:',bad) if bad else print('OK'); sys.exit(1 if bad else 0)"
