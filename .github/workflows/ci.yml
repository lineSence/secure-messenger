# Конвейер проверки (шаг 0 плана MVP; ADR-15, ADR-20, ADR-26).
# Действия закреплены по SHA коммита (защита от подмены тегов). Обновлять — PR с новыми SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ADR-27: push в main только с документацией — тяжёлые задачи пропускаются, остаётся docs.
  # ADR-28: push в PR, где изменены только вердикты ревью, а свежих ревью меньше нужного (1 из 2), —
  # CI не запускается (wait=true), ci-ok пишет «ждём второе ревью». Полный прогон — когда ревью 2 из 2.
  # Ошибка этой задачи роняет ci-ok (зависимые задачи — skipped, сама — failure).
  changes:
    name: Что изменилось (код или только документация)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      wait: ${{ steps.diff.outputs.wait }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          wait=false
          # Документация: wiki/, design/, memory/ и *.md в корне. Всё остальное — код.
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --no-renames --name-only "$BEFORE" "$SHA")
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(wiki/|design/|memory/)|^[^/]+\.md$'; then code=false; fi
          fi
          # ADR-28. Подсчёт свежих ревью — как в scripts/ai-review.mjs: после reviewed_head менялись только вердикты.
          # Битый или нечитаемый pr-N.json → не ждём (wait=false): полный прогон, и ai-review.mjs назовёт причину.
          M=.github/ai-review/manual/
          if [ "$EVENT" = pull_request ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --no-renames --name-only "$BEFORE" "$HEAD")
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv "^$M"; then
              # Порог — из базовой ветки, как и настройки ревью (PR не влияет на своё ревью);
              # из ветки PR — только если в базовой ветке файла ещё нет.
              if git cat-file -e "$BASE:.github/ai-review.json" 2>/dev/null; then
                need=$(git show "$BASE:.github/ai-review.json" | jq -r '.min_models_ok // 2')
              else
                need=$(jq -r '.min_models_ok // 2' .github/ai-review.json)
              fi
              case "$need" in ''|*[!0-9]*) echo "::warning::min_models_ok не число ($need) — беру 2"; need=2 ;; esac
              fresh=$(node -e '
                const { execFileSync: x } = require("node:child_process");
                const [m, pr, head] = process.argv.slice(1);
                const git = (...a) => x("git", a, { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] });
                const file = `${m}pr-${pr}.json`;
                const ok = new Set();
                try {
                  try { git("cat-file", "-e", `${head}:${file}`); } catch { console.log(0); process.exit(0); } // вердиктов нет
                  const v = JSON.parse(git("show", `${head}:${file}`));
                  for (const r of Array.isArray(v.reviews) ? v.reviews : []) {
                    const name = String(r.model || "").trim().toLowerCase();
                    const rh = String(r.reviewed_head || v.reviewed_head || "");
                    if (!name || !Array.isArray(r.findings) || !/^[0-9a-f]{40}$/.test(rh)) continue;
                    // Ревью не того кода (коммит не предок head) — не свежее; это не ошибка.
                    try { git("merge-base", "--is-ancestor", rh, head); } catch { continue; }
                    if (!git("diff", "--no-renames", "--name-only", `${rh}..${head}`).split("\n").some((f) => f && !f.startsWith(m))) ok.add(name);
                  }
                } catch (e) {
                  console.error(`::warning::${file} не разобран (${String(e.message).split("\n")[0]}) — полный прогон, причину покажет ai-review`);
                  console.log("error");
                  process.exit(0);
                }
                console.log(ok.size);' "$M" "$PR" "$HEAD")
              echo "Свежих ревью: $fresh из $need"
              if [ "$fresh" != error ] && [ "$fresh" -lt "$need" ]; then wait=true; fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "wait=$wait" >> "$GITHUB_OUTPUT"
          echo "Изменён код: $code; ждём ревью: $wait"

  rust:
    name: rustfmt · clippy · тесты
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  supply-chain:
    name: cargo-deny · cargo-audit · cargo-vet · OSV-Scanner
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-vet@0.10.0,osv-scanner@2.6.0
      - run: cargo deny --locked check
      # fuzz/ — отдельный workspace: те же запреты [bans] (ADR-1) по его графу зависимостей.
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check bans
      - run: cargo audit --deny warnings
      - run: cargo audit --deny warnings --file fuzz/Cargo.lock
      - run: cargo vet --locked
      - run: osv-scanner scan source --recursive .

  semgrep:
    name: Semgrep (свои правила + p/rust)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Списки запрещённой криптографии согласованы (deny.toml и правила semgrep)
        run: node scripts/check-crypto-bans.mjs
      - run: pipx install semgrep==1.180.0
      - run: semgrep scan --config .semgrep/ --config p/rust --error --metrics=off .

  fuzz:
    name: Фаззинг (короткий прогон)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install nightly-2026-10-08 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: fuzz }
      - run: cargo +nightly-2026-10-08 install cargo-fuzz --version 0.13.2 --locked
      - name: Каждая цель — 120 секунд
        working-directory: fuzz
        run: |
          for t in $(cargo +nightly-2026-10-08 fuzz list); do
            cargo +nightly-2026-10-08 fuzz run "$t" -- -max_total_time=120
          done

  kani:
    name: Kani (доказательства разбора)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install --locked kani-verifier --version 0.68.0
      - run: cargo kani setup
      - run: cargo kani -p sm-core -Z stubbing

  docs:
    name: Линт базы знаний (SEK)
    needs: changes
    if: needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: node scripts/sek-lint.mjs

  ai-review:
    name: ИИ-ревью (ансамбль моделей)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.wait != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Скрипт ревью из базовой ветки (PR не может подменить проверку)
        run: |
          git show "$BASE_SHA:scripts/ai-review.mjs" > "$RUNNER_TEMP/ai-review.mjs" 2>/dev/null || cp scripts/ai-review.mjs "$RUNNER_TEMP/ai-review.mjs"
          node "$RUNNER_TEMP/ai-review.mjs"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          PR: ${{ github.event.pull_request.number }}

  ci-ok:
    name: ci-ok (итог — обязательная проверка)
    if: always()
    needs: [changes, rust, supply-chain, semgrep, fuzz, kani, docs, ai-review]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Отчёт в PR (агенты читают его через API комментариев)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WAIT: ${{ needs.changes.outputs.wait }}
        run: |
          if [ "$WAIT" = true ]; then
            gh pr comment "$PR" --body "### Конвейер ci: ${SHA:0:7}
          ⏸ CI не запускался (ADR-28): изменены только вердикты, свежих ревью меньше двух. Нужно второе ревью по тому же head — тогда пройдёт полный прогон."
            exit 0
          fi
          {
            echo "### Конвейер ci: ${SHA:0:7}"
            echo
            echo "| Задача | Итог |"
            echo "|---|---|"
            echo "$NEEDS" | python3 -c "import json,sys;[print(f'| {k} | {v[\"result\"]} |') for k,v in json.load(sys.stdin).items()]"
            if echo "$NEEDS" | grep -q '"failure"'; then
              echo
              echo "<details><summary>Последние строки логов упавших шагов</summary>"
              echo
              echo '```'
              for id in $(gh api "repos/$GH_REPO/actions/runs/$RUN/jobs" --jq '.jobs[] | select(.conclusion=="failure") | .id'); do
                echo "=== $(gh api "repos/$GH_REPO/actions/jobs/$id" --jq .name)"
                if curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GH_REPO/actions/jobs/$id/logs" -o job.log 2> job.err; then
                  sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g; s/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' job.log | sed '/Post job cleanup/,$d' | grep -v -E '^[[:space:]]*$|^##\[(group|endgroup)' > job.txt || true
                  { grep -n -E 'error(\[|:)|##\[error\]|FAILED|failed|panicked|БЛОК|Ошибка|❯|❱|попытка [0-9]|ответ [0-9]+ символов|отвергнуты' job.txt | tail -n 40 || true; echo "--- конец шагов:"; tail -n 10 job.txt; } | cut -c1-220
                else
                  echo "лог недоступен: $(head -c 300 job.err)"
                fi
              done
              echo '```'
              echo "</details>"
            fi
          } > report.md
          gh pr comment "$PR" --body-file report.md
      - name: Все проверки зелёные
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          WAIT: ${{ needs.changes.outputs.wait }}
        # changes — всегда success. В PR пропусков нет: skipped = провал (задачу могли выключить условием).
        # skipped допустим только вне PR (push в main с документацией, ADR-27).
        run: |
          if [ "$WAIT" = true ]; then echo "Ждём второе ревью (ADR-28): проверки не запускались — не зелёный."; exit 1; fi
          echo "$NEEDS" | python3 -c "
          import json,os,sys
          pr=os.environ['EVENT']=='pull_request'
          def ok(k,r): return r=='success' or (r=='skipped' and not pr and k!='changes')
          bad={k:v['result'] for k,v in json.load(sys.stdin).items() if not ok(k,v['result'])}
          print('Провалены:',bad) if bad else print('OK'); sys.exit(1 if bad else 0)"
