# Подпись APK релиза (ADR-76). Запуск — только по тегу vX.Y.Z… после слияния PR релиза (ADR-58).
# Три задачи: `build` собирает неподписанный APK без секретов; `sign` — в окружении `release`
# (одобрение владельца, только теги v*) — не делает checkout и не исполняет код проекта и
# зависимостей: только `apksigner` из Android SDK образа раннера; `draft` создаёт черновик релиза.
# Секреты: RELEASE_KEYSTORE_B64 (keystore в base64), RELEASE_KEYSTORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD. Действия закреплены по SHA, как в ci.yml.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Доказательства Kani (ADR-105) — в PR их нет; подпись ждёт их успеха.
  kani:
    uses: ./.github/workflows/kani.yml

  build:
    name: Неподписанный APK релиза
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      NDK_VERSION: 28.2.13676358
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Тег должен совпадать с versionName (ADR-78): иначе имя файла и версия расходятся.
      - name: Тег = versionName
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' android/app/build.gradle.kts)
          test -n "$version"
          if [ "$TAG" != "v$version" ]; then
            echo "Тег $TAG не совпадает с versionName $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: '17' }
      - run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-37.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: bash scripts/build-android-core.sh release
      - name: Gradle (дистрибутив по sha256, как в ci.yml)
        env:
          GRADLE_VERSION: 9.8.1
          GRADLE_SHA256: dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
      # Без кэша Gradle: сборку релиза не кормим кэшем из PR.
      - working-directory: android
        run: gradle --no-daemon assembleRelease lintRelease
      # Код сборки отработал здесь, без секретов; дальше передаётся только файл APK.
      - name: Один неподписанный APK
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*-release-unsigned.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::ожидался один неподписанный APK, найдено ${#apks[@]}"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: android/app/build/outputs/apk/release/*-release-unsigned.apk
          retention-days: 1
          if-no-files-found: error

  sign:
    name: Подпись APK (apksigner, без кода сборки)
    needs: [build, kani]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions: {}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Без checkout: в задаче с ключом нет кода репозитория и зависимостей. Версия — из тега
      # (совпадение с versionName проверила задача build).
      - name: Версия из тега
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Подпись apksigner (v2 + v3) и проверка
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KS_B64" && test -n "$KS_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS"
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$ks"
          mkdir -p "$RUNNER_TEMP/notes"
          shopt -s nullglob
          apks=("$RUNNER_TEMP/unsigned/"*.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::ожидался один неподписанный APK, найдено ${#apks[@]}"; exit 1; }
          in=${apks[0]}
          mkdir -p "$RUNNER_TEMP/signed"
          out="$RUNNER_TEMP/signed/uncensored-$VERSION.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled true --out "$out" "$in"
          "$bt/apksigner" verify --verbose --print-certs "$out" | tee "$RUNNER_TEMP/verify.txt"
          # Новые build-tools пишут «V3.0 Signer: certificate …», старые — «Signer #1 certificate …».
          grep -qx 'Number of signers: 1' "$RUNNER_TEMP/verify.txt" || { echo "::error::подписантов не 1"; exit 1; }
          cert=$(sed -n -E 's/^(Signer #1|V3\.0 Signer):? certificate SHA-256 digest: ([0-9a-f]{64})$/\2/p' "$RUNNER_TEMP/verify.txt")
          test -n "$cert" || { echo "::error::SHA-256 сертификата не найден в выводе apksigner verify"; exit 1; }
          apk=$(sha256sum "$out" | cut -d' ' -f1)
          {
            echo "APK: \`uncensored-$VERSION.apk\`"
            echo
            echo "- SHA-256 APK: \`$apk\`"
            echo "- SHA-256 сертификата подписи: \`$cert\`"
            echo
            echo "Проверка: \`apksigner verify --print-certs uncensored-$VERSION.apk\` — сертификат должен совпасть."
          } > "$RUNNER_TEMP/notes/notes.md"
          cat "$RUNNER_TEMP/notes/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uncensored-${{ env.VERSION }}
          path: ${{ runner.temp }}/signed/uncensored-${{ env.VERSION }}.apk
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/notes.md
          retention-days: 1
          if-no-files-found: error

  # Черновик: публикует владелец после проверки суммы (ADR-76 п.3). Ключа здесь нет.
  draft:
    name: Черновик релиза на GitHub
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # черновик релиза на GitHub
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Версия из тега
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uncensored-${{ env.VERSION }}
          path: ${{ runner.temp }}/signed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - name: Черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$TAG" "$RUNNER_TEMP/signed/uncensored-$VERSION.apk" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes/notes.md" --prerelease
