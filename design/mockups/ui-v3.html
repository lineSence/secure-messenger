<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Макет UI v3 — secure-messenger</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,"Segoe UI",Arial,sans-serif;background:#cfd4db;display:flex;gap:20px;justify-content:center;align-items:flex-start;padding:16px;flex-wrap:wrap;color:#1b1f24}
.panel{width:330px;background:#fff;border-radius:12px;padding:14px 16px;font-size:13px;max-height:calc(100vh - 32px);overflow:auto}
.panel h2{font-size:15px;margin:14px 0 6px}.panel h2:first-child{margin-top:0}
.panel label{display:flex;gap:6px;align-items:flex-start;margin:4px 0;cursor:pointer}
.panel small,.panel .d{color:#5b6470}
.vlist label{padding:6px;border-radius:8px}.vlist label:hover{background:#f0f2f5}
.vlist b{display:block;font-size:13px}.vlist span{color:#5b6470;font-size:12px}
.why{background:#f3f6fa;border-radius:8px;padding:8px;margin-top:6px;color:#3b4450}
.phone{width:390px;height:800px;border-radius:40px;background:#0b0b0c;padding:11px;box-shadow:0 12px 40px #0005;flex:none}
.screen{width:100%;height:100%;border-radius:30px;overflow:hidden;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;position:relative;font-size:var(--fs);transition:background .2s}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:16px;height:16px}svg.xs{width:14px;height:14px}
.sb{height:28px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;background:var(--hd);color:var(--hdt);flex:none}
.sb span{display:flex;gap:4px;align-items:center}
.hdr{display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--hd);color:var(--hdt);min-height:56px;flex:none;box-shadow:var(--hdsh)}
.hdr h1{font-size:calc(var(--fs) + 5px);margin:0 0 0 6px;flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub{font-size:12px;opacity:.8;font-weight:400;display:block}
.ib{border:0;background:none;color:inherit;width:48px;height:48px;border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:var(--hov)}
.body{flex:1;overflow-y:auto;position:relative}
.netbar{display:flex;align-items:center;gap:8px;padding:0 14px;min-height:36px;font-size:12px;cursor:pointer;flex:none;border-bottom:1px solid var(--line);background:var(--sur)}
.netbar b{font-weight:600}.netbar .grow{flex:1;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.netbar.strip{border:0;color:#fff;font-weight:500}.netbar.strip .grow{color:#fffd}
.ok{--c:var(--okc)}.warn{--c:var(--warnc)}.bad{--c:var(--badc)}
.netbar .lamp{width:10px;height:10px;border-radius:5px;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.netbar.strip.ok{background:var(--okc)}.netbar.strip.warn{background:var(--warnc)}.netbar.strip.bad{background:var(--badc)}.netbar.strip .lamp{background:#fff;box-shadow:none}
.folders{display:flex;gap:4px;padding:0 8px;background:var(--hd);color:var(--hdt);flex:none;overflow-x:auto}
.folders button{border:0;background:none;color:inherit;opacity:.7;padding:10px 12px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;font-family:inherit;white-space:nowrap}
.folders button.on{opacity:1;border-color:currentColor;font-weight:600}
.folders .cnt{font-size:11px;background:currentColor;border-radius:9px;padding:0 6px;margin-left:4px}
.folders .cnt i{color:var(--hd);font-style:normal}
.row{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:var(--rowh);cursor:pointer;position:relative;background:var(--sur)}
.row:hover{background:var(--hov)}
.row:after{content:"";position:absolute;left:calc(var(--av) + 26px);right:0;bottom:0;border-bottom:1px solid var(--line)}
.av{width:var(--av);height:var(--av);border-radius:var(--avr);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none;font-size:calc(var(--av) * .38)}
.rt{flex:1;min-width:0;padding:8px 0}
.rt .n{display:flex;align-items:center;gap:6px;font-weight:600}
.rt .n .t{margin-left:auto;font-size:12px;color:var(--tx2);font-weight:400;display:flex;gap:3px;align-items:center}
.rt .l{display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:calc(var(--fs) - 1px);margin-top:3px}
.rt .l span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .l span.badge{flex:none}
.rt .l .nm{flex:none;color:var(--tx);opacity:.85}
.badge{background:var(--acc);color:var(--acct);border-radius:11px;font-size:12px;min-width:22px;height:22px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:1px 6px;border-radius:6px;font-weight:500;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:var(--fabr);background:var(--acc);color:var(--acct);border:0;cursor:pointer;box-shadow:0 4px 14px #0003;display:flex;align-items:center;justify-content:center;z-index:2}
.nav{display:flex;background:var(--nav);border-top:1px solid var(--line);height:72px;flex:none}
.nav.float{position:absolute;left:16px;right:16px;bottom:14px;height:64px;border-radius:32px;border:1px solid var(--line);box-shadow:0 6px 24px #0003;background:color-mix(in srgb,var(--nav) 88%,transparent);backdrop-filter:blur(14px);z-index:3}
.nav button{flex:1;border:0;background:none;color:var(--tx2);font-size:12px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nav button .pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.nav button.on{color:var(--tx);font-weight:600}.nav button.on .pill{background:var(--pill);color:var(--pillt)}
.nav .dotn{position:relative}.nav .dotn:after{content:"";position:absolute;top:2px;right:16px;width:8px;height:8px;border-radius:4px;background:var(--c)}
.chatbg{background:var(--wall)}
.msgs{padding:10px 10px 16px;display:flex;flex-direction:column;gap:4px}
.m{max-width:80%;padding:6px 10px 6px;border-radius:var(--br);line-height:1.35;background:var(--bin);color:var(--tx);box-shadow:0 1px 1px #0000001a;position:relative}
.m.me{align-self:flex-end;background:var(--bout);color:var(--boutt)}
.m.in{align-self:flex-start}
.m.tail.in{border-bottom-left-radius:4px}.m.tail.me{border-bottom-right-radius:4px}
.m .who{font-size:13px;font-weight:600;color:var(--acc2);display:block;margin-bottom:1px}
.m .meta{float:right;margin:6px 0 -4px 10px;font-size:11px;color:var(--metac);display:flex;align-items:center;gap:3px}
.m.me .meta{color:var(--metaout)}
.m.big{font-size:34px;background:none;box-shadow:none;padding:0}
.m.big .meta{background:#0006;color:#fff;border-radius:8px;padding:1px 6px}
.day{align-self:center;font-size:12px;color:var(--sysct);background:var(--sysc);padding:3px 10px;border-radius:12px;margin:6px 0}
.comp{display:flex;gap:2px;padding:6px 6px;background:var(--sur);align-items:flex-end;flex:none;border-top:1px solid var(--line)}
.comp input{flex:1;border:0;padding:12px 6px;background:transparent;color:var(--tx);font-size:var(--fs);outline:0;font-family:inherit;min-width:0}
.comp .send{background:var(--acc);color:var(--acct);border-radius:24px}
.comp .send:hover{background:var(--acc)}
.picker{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;background:var(--sur);border-top:1px solid var(--line);flex:none}
.picker button{font-size:24px;border:0;background:none;height:44px;border-radius:8px;cursor:pointer}.picker button:hover{background:var(--hov)}
.banner{display:flex;gap:10px;align-items:center;padding:8px 12px;font-size:13px;background:color-mix(in srgb,var(--c) 14%,var(--sur));color:var(--tx);flex:none;border-bottom:1px solid var(--line)}
.banner svg{color:var(--c)}.banner .grow{flex:1}
.btn{border:0;border-radius:var(--btnr);padding:0 18px;height:44px;background:var(--acc);color:var(--acct);font-size:14px;cursor:pointer;font-family:inherit;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.sec{background:var(--pill);color:var(--pillt)}.btn.sm{height:36px;padding:0 14px;font-size:13px}.btn.w{width:100%}
.btn.txt{background:none;color:var(--acc2)}
.btn:disabled{opacity:.4;cursor:default}
.sech{padding:16px 16px 6px;font-size:13px;color:var(--acc2);font-weight:600}
.card{background:var(--sur);margin:10px 12px;border-radius:var(--cardr);padding:14px;border:var(--cardb)}
.card h3{margin:0 0 4px;font-size:calc(var(--fs) + 1px)}
.muted{color:var(--tx2);font-size:13px;line-height:1.4}
.tabs{display:flex;background:var(--hd);color:var(--hdt);flex:none}
.tabs button{flex:1;border:0;background:none;color:inherit;opacity:.7;padding:12px 4px;cursor:pointer;font-family:inherit;font-size:14px;border-bottom:3px solid transparent;display:flex;gap:6px;justify-content:center;align-items:center}
.tabs button.on{opacity:1;border-color:currentColor;font-weight:600}
.qr{width:208px;height:208px;margin:14px auto;padding:10px;background:#fff;border-radius:16px;box-shadow:0 1px 4px #0002}
.cam{height:280px;margin:12px;border-radius:16px;background:#1d1f22;display:flex;align-items:center;justify-content:center;color:#ccc;position:relative;flex-direction:column;gap:8px}
.cam .frame{width:170px;height:170px;border:3px solid #fff;border-radius:18px}
.code{font-family:"Courier New",monospace;font-size:18px;letter-spacing:1px;text-align:center;line-height:1.75}
.tr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.tr:last-child{border:0}
.tr .rt{padding:0}.tr .rt b{display:block;font-weight:500}.tr .rt span{color:var(--tx2);font-size:13px}
.lampc{width:12px;height:12px;border-radius:6px;background:var(--c);flex:none}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.types div{padding:10px;border-radius:12px;font-size:13px;background:color-mix(in srgb,var(--c) 13%,var(--sur));display:flex;gap:8px;align-items:center}
.types svg{color:var(--c)}
.srow{display:flex;align-items:center;gap:16px;padding:0 16px;min-height:60px;cursor:pointer;background:var(--sur)}
.srow:hover{background:var(--hov)}.srow .ic{color:var(--tx2)}.srow .rt b{display:block;font-weight:500}.srow .rt span{color:var(--tx2);font-size:13px}
.srow .chev{color:var(--tx2)}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;cursor:pointer;border:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:.2s;box-shadow:0 1px 3px #0004}
.sw.on{background:var(--acc)}.sw.on:after{left:21px}
.scrim{position:absolute;inset:0;background:#0007;z-index:8;display:flex}
.sheet{margin-top:auto;background:var(--sur);width:100%;border-radius:24px 24px 0 0;padding:8px 0 16px}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#2b2f35;color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:20;white-space:nowrap;box-shadow:0 4px 12px #0004}
.center{text-align:center;padding:16px 20px}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.prog div{height:100%;background:var(--acc);transition:width .3s}
.inp{width:100%;height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:14px;font-family:inherit}
select.inp{height:40px}
.hint{font-size:12px;color:#5b6470;margin-top:4px}

:root{--ed:cubic-bezier(.05,.7,.1,1);--es:cubic-bezier(.2,0,0,1)}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.a-push{animation:push .4s var(--ed)}@keyframes push{from{transform:translateX(28%);opacity:0}}
.a-pop{animation:popb .35s var(--ed)}@keyframes popb{from{transform:translateX(-18%);opacity:.3}}
.a-fade{animation:fade .2s var(--es)}@keyframes fade{from{opacity:0}}
.m{transition:transform .25s var(--ed)}.m.drag{transition:none}
.m.new{animation:msgin .3s var(--ed)}@keyframes msgin{from{transform:translateY(14px) scale(.9);opacity:0}}
.m.me.new{transform-origin:100% 100%}.m.in.new{transform-origin:0 100%}
.scrim.a-in{animation:fade .25s var(--es)}.sheet.a-in{animation:up .35s var(--ed)}@keyframes up{from{transform:translateY(100%)}}
.toast{animation:toastin .25s var(--ed)}@keyframes toastin{from{transform:translate(-50%,16px);opacity:0}}
.btn,.ib,.row,.srow,.rx{transition:transform .12s var(--es),background .15s}.btn:active,.ib:active,.rx:active{transform:scale(.92)}
.msgs{overflow-x:hidden}
.swi{position:absolute;right:-40px;top:50%;margin-top:-14px;width:28px;height:28px;border-radius:14px;background:var(--sysc);color:var(--sysct);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none}
.q{border-left:3px solid var(--acc2);padding:3px 8px;margin:2px 0 5px;border-radius:4px;background:color-mix(in srgb,var(--acc2) 12%,transparent);cursor:pointer;font-size:13px}
.q b{color:var(--acc2);display:block;font-size:12px}.q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;color:var(--tx2)}
.m.me .q{border-color:currentColor;background:#ffffff26}.m.me .q b,.m.me .q span{color:inherit}
.rxs{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;clear:both}
.rx{border:0;border-radius:14px;height:28px;padding:0 8px;font-size:15px;display:inline-flex;gap:4px;align-items:center;cursor:pointer;background:color-mix(in srgb,var(--acc2) 14%,transparent);color:var(--acc2);font-family:inherit}
.rx b{font-size:12px}.rx.mine{background:var(--acc2);color:var(--acct)}
.m.me .rx{background:#ffffff38;color:inherit}.m.me .rx.mine{background:var(--acc);color:var(--acct)}
.rx.new{animation:rxpop .4s var(--ed)}@keyframes rxpop{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.flash{animation:flash 1.3s var(--es)}@keyframes flash{0%,45%{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 55%,transparent)}}
.ctxw{margin:auto 12px 90px;width:calc(100% - 24px)}
.ctx{background:var(--sur);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px #0005}.ctx.a-in{animation:ctxin .28s var(--ed)}@keyframes ctxin{from{transform:scale(.9) translateY(14px);opacity:0}}
.rxbar{display:flex;justify-content:space-between;padding:6px 8px;background:var(--sur);border-radius:26px;margin-bottom:8px;box-shadow:0 6px 20px #0004}
.rxbar button{border:0;background:none;font-size:26px;width:40px;height:44px;border-radius:22px;cursor:pointer}.rxbar button:hover,.rxbar button.mine{background:var(--hov)}
.rxbar.a-in button{animation:rxpop .35s var(--ed) both}
.rxbar.a-in button:nth-child(2){animation-delay:.03s}.rxbar.a-in button:nth-child(3){animation-delay:.06s}.rxbar.a-in button:nth-child(4){animation-delay:.09s}.rxbar.a-in button:nth-child(5){animation-delay:.12s}.rxbar.a-in button:nth-child(6){animation-delay:.15s}.rxbar.a-in button:nth-child(7){animation-delay:.18s}
.ctxprev{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--tx2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxinfo{padding:10px 16px;font-size:12px;color:var(--tx2);display:flex;gap:6px;align-items:center;border-top:1px solid var(--line)}
.replybar{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 14px;background:var(--sur);border-top:1px solid var(--line);flex:none;color:var(--acc2)}
.replybar.a-in{animation:slideup .25s var(--ed)}@keyframes slideup{from{transform:translateY(60%);opacity:0}}
.replybar .rt{border-left:3px solid var(--acc2);padding:2px 0 2px 8px}.replybar .rt b{font-size:13px;display:block}.replybar .rt span{font-size:13px;color:var(--tx2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
.nomo *,.nomo{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){.screen *{animation:none!important;transition:none!important}}
</style>
</head>

<div class="phone"><div class="screen" id="scr"></div></div>
<script>

function runDiag(){if(S.diagRun)return;S.diagRun=true;S.diagP=0;r();const t=setInterval(()=>{S.diagP+=20;if(S.diagP>=100){clearInterval(t);S.diagRun=false;toast(S.autoRep?'Проверка завершена · отчёт отправлен группе':'Проверка завершена');return}r()},350)}
function srow(icn,b,sp,onc,extra){return `<div class="srow" onclick="${onc}"><span class="ic">${ic(icn)}</span><div class="rt"><b>${b}</b><span>${sp}</span></div>${extra||`<span class="chev">${ic('chev','s')}</span>`}</div>`}
function vSet(isTab){return hdr('Настройки',{back:!isTab})+`<div class="body"><div class="srow" style="min-height:84px" onclick="go('mykey')"><div class="av" style="background:${COL[3]}">Я</div><div class="rt"><b>Мой профиль и ключ</b><span>Без телефона и почты</span></div><span class="chev">${ic('qr')}</span></div><div class="sech">Связь</div>${srow('net','Проверка связи','Что работает сейчас',"go('diag')")}${srow('radio','LoRa (Reticulum)','Heltec V3 · подключён по Bluetooth',"go('lora')")}<div class="sech">Устройства и безопасность</div>${srow('laptop','Мои устройства','2: этот телефон, Windows-ПК',"go('devices')")}${srow('lock','Конфиденциальность','Отчёты о прочтении выкл.',"toast('Раздел в разработке')")}<div class="sech">Приложение</div>${srow('download','Обновления',S.upd==='avail'?'Доступна версия 0.2.0':'Установлена последняя версия',"go('upd')",S.upd==='avail'?'<span class="badge">1</span>':undefined)}${srow('palette','Оформление','Как в системе',"toast('Тема следует системной')")}${srow('bell','Уведомления','Постоянное соединение, без Google',"toast('Раздел в разработке')")}</div>`}
function vDevices(){return hdr('Мои устройства',{back:true})+`<div class="body"><div class="card"><div class="tr"><span class="ic">${ic('phone')}</span><div class="rt"><b>Этот телефон</b><span>Pixel · основное</span></div></div><div class="tr"><span class="ic">${ic('laptop')}</span><div class="rt"><b>Windows-ПК</b><span>в сети 10 мин назад</span></div><button class="btn sm sec" onclick="toast('Устройство отключено, ключи сменены')">Отключить</button></div></div><div class="card"><h3>Подключить устройство</h3><p class="muted">На новом устройстве выберите «Подключить к существующему» и отсканируйте QR. История переносится в зашифрованном виде с этого телефона.</p><button class="btn w" onclick="go('link')">${ic('qr','s')}Показать QR</button></div></div>`}
function vLink(){return hdr('Подключить устройство',{back:true})+`<div class="body"><div class="qr">${qrSvg(11)}</div><div class="center muted">Отсканируйте на новом устройстве. Держите устройства рядом до конца переноса.</div><div class="card"><h3>Перенос истории</h3><div class="prog" style="margin:10px 0"><div style="width:62%"></div></div><span class="muted">62% · 1 240 из 2 000 сообщений</span></div></div>`}
function vLora(){return hdr('LoRa (Reticulum)',{back:true})+`<div class="body"><div class="card"><div class="tr ok"><span class="lampc"></span><div class="rt"><b>Heltec V3 «RNode-1»</b><span>Bluetooth · заряд 78% · 868 МГц</span></div><span class="ic">${ic('bt')}</span></div><div class="tr"><span class="ic">${ic('radio')}</span><div class="rt"><b>Узлы рядом</b><span>1 — «RNode-2» (Аня), сигнал хороший</span></div></div><div class="tr"><div class="rt"><b>Использовать LoRa</b><span>только когда нет интернета</span></div><button class="btn sm sec" onclick="toast('Варианты: всегда / только без интернета / выкл.')">Изменить</button></div></div><div class="card muted">По LoRa идёт только текст: короткие сообщения, доставка может занимать минуты. Шифрование то же, что и через интернет.</div><div style="padding:0 12px"><button class="btn sec w" onclick="toast('Поиск устройств Bluetooth…')">${ic('bt','s')}Подключить другой модуль</button></div></div>`}
function vUpd(){if(S.upd==='done')return hdr('Обновления',{back:true})+`<div class="body center"><h2>0.2.0</h2><span class="tag ok" style="font-size:13px;padding:3px 10px">${ic('check','xs')}Установлена последняя версия</span></div>`;
 return hdr('Обновления',{back:true})+`<div class="body"><div class="card"><h3>Доступна версия 0.2.0</h3><p class="muted">Скачано через ${NET[S.net].ch} · 18 МБ</p><span class="tag ok" style="font-size:13px;padding:3px 10px">${ic('shield','xs')}Подпись релиза верна</span><p>Что нового: проверка связи показывает задержку; исправлен перенос истории.</p><button class="btn w" onclick="S.upd='done';toast('Android попросит подтвердить установку')">${ic('download','s')}Установить</button></div><div class="card muted">Если подпись не совпадёт — установки не будет, приложение покажет предупреждение.</div></div>`}
function vMyKey(){return hdr('Мой ключ',{back:true})+`<div class="body"><div class="qr">${qrSvg(5)}</div><div class="center muted">Ваш идентификатор — это ключ. Телефон и почта не нужны.</div><div class="card code" style="font-size:14px">a3f9 21c7 7e0b 9d44<br>05e1 c2a8 66f3 1b90</div></div>`}
function overlay(){const A=S.ovAnim?'a-in':'';
 if(S.ctx){const m=findMsg(S.ctx.id);if(!m){S.ctx=null;return ''}const o=(i,l,p)=>`<div class="srow" style="min-height:52px" onclick="${p}"><span class="ic">${ic(i)}</span><div class="rt"><b>${l}</b></div></div>`;
  return `<div class="scrim ${A}" style="background:#0005" onclick="if(event.target===this){S.ctx=null;r()}"><div class="ctxw"><div class="rxbar ${A}">${RX.map(e=>`<button class="${m.rx[e]&&m.rx[e].me?'mine':''}" onclick="react(${m.id},'${e}')">${e}</button>`).join('')}</div><div class="ctx ${A}"><div class="ctxprev">${esc(m.t)}</div>${o('reply','Ответить',`setReply(${m.id})`)}${o('copy','Копировать',`S.ctx=null;toast('Текст скопирован')`)}${m.a==='me'?`<div class="ctxinfo">${ic('check2','xs')}Отправлено ${m.tm} · ${m.ch}</div>`:''}</div></div></div>`}
 if(!S.sheet)return '';const close=`onclick="if(event.target===this){S.sheet=null;r()}"`;
 let o='';const opt=(i,l,p)=>`<div class="srow" onclick="S.sheet=null;${p}"><span class="ic">${ic(i)}</span><div class="rt"><b>${l}</b></div></div>`;
 if(S.sheet==='new')o=opt('userplus','Новый контакт (QR или ссылка)',"S.addTab='my';go('add')")+opt('group','Новая группа',"toast('Выбор участников группы')");
 if(S.sheet==='invite')o=opt('user','Миша',"toast('Миша добавлен, ключи группы обновлены')")+opt('userplus','Новый человек — сначала добавить контакт',"S.addTab='my';go('add')");
 return `<div class="scrim ${A}" ${close}><div class="sheet ${A}"><div class="grab"></div>${o}</div></div>`}
function r(){O=applyVars();let v;const p=S.stack[S.stack.length-1];
 if(!p){v=S.nav==='A'?(S.tab==='chats'?vChats():S.tab==='diag'?vDiag(true):vSet(true)):vChats()}
 else if(p.startsWith('chat:'))v=vChat(p.slice(5));else if(p.startsWith('info:'))v=vInfo(p.slice(5));else if(p.startsWith('verify:'))v=vVerify(p.slice(7));
 else v={add:vAdd,diag:()=>vDiag(false),set:()=>vSet(false),devices:vDevices,link:vLink,lora:vLora,upd:vUpd,mykey:vMyKey}[p]();
 const showNav=!p;
 const scr=document.getElementById('scr');const oldCb=document.getElementById('cb');const key=S.stack.join('/');const keep=oldCb&&scr.dataset.key===key&&!S.toBottom?oldCb.scrollTop:null;
 scr.classList.toggle('nomo',S.nomo);
 scr.innerHTML=`<div class="sb"><span>12:45</span><span>${ic('net','xs')}${ic('lock','xs')}78%</span></div><div class="view ${S.anim?'a-'+S.anim:''}">`+v+`</div>`+(showNav?navbar():'')+overlay()+(S.toast?`<div class="toast">${S.toast}</div>`:'');
 scr.dataset.key=key;const cb=document.getElementById('cb');if(cb)cb.scrollTop=keep!==null?keep:cb.scrollHeight;
 S.anim='';S.ovAnim=false;S.newMsg=0;S.toBottom=false;
 panel()}
function panel(){const v=V[S.v];document.getElementById('panel').innerHTML=`<h2>Макет UI v3</h2><small>Интерактивный макет по правилу [UI-MOCKUP-FIRST]. Оставлены варианты 1, 3, 7, 8 и только нижняя навигация. Эмодзи — только в сообщениях, реакциях и панели эмодзи; значки интерфейса — SVG.</small>
<h2>Вариант оформления</h2><div class="vlist">${V.map((x,i)=>`<label><input type="radio" name="v" ${i===S.v?'checked':''} onchange="S.v=${i};r()"><span><b>${x.id}. ${x.name}</b><span>${x.d}</span></span></label>`).join('')}</div>
<div class="why"><b>Почему так:</b> ${v.why}</div>
<h2>Тема</h2><label><input type="radio" name="th" ${S.theme==='system'?'checked':''} onchange="S.theme='system';r()"><span>Как в системе (сейчас: ${mq.matches?'тёмная':'светлая'})</span></label><label><input type="radio" name="th" ${S.theme==='light'?'checked':''} onchange="S.theme='light';r()"><span>Просмотр: светлая</span></label><label><input type="radio" name="th" ${S.theme==='dark'?'checked':''} onchange="S.theme='dark';r()"><span>Просмотр: тёмная</span></label>
<h2>Анимации</h2><label><input type="checkbox" ${S.nomo?'checked':''} onchange="S.nomo=this.checked;r()"><span>Имитация системной настройки «Убрать анимацию» — приложение её соблюдает</span></label>
<h2>Состояние связи (для показа)</h2>${[['ok','Основной канал работает'],['warn','Только запасной путь (белые списки)'],['bad','Нет интернета, только LoRa']].map(([k,l])=>`<label><input type="radio" name="net" ${S.net===k?'checked':''} onchange="S.net='${k}';r()"><span>${l}</span></label>`).join('')}
<h2>Что попробовать</h2><small>1) Откройте «Семья». 2) Касание сообщения — меню: реакции, «Ответить», «Копировать». 3) Двойное касание — быстрая реакция «нравится». 4) Потяните сообщение влево — ответ. 5) Нажмите на цитату в сообщении — переход к оригиналу с подсветкой. 6) Нажмите на реакцию под сообщением — поставить или снять. 7) Переходы между экранами, нижняя панель, «Карандаш» — новый контакт.</small>`}
mq.addEventListener('change',()=>r());
(function(){const scr=document.getElementById('scr');let drag=null,last={id:0,t:0},tmr;
 scr.addEventListener('pointerdown',e=>{const b=e.target.closest('.m[data-id]');if(!b||e.target.closest('.rx,.q'))return;drag={b,id:+b.dataset.id,x:e.clientX,y:e.clientY,dx:0,moved:false};b.classList.add('drag')});
 scr.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(e.clientY-drag.y)>24&&drag.dx>-6){end(true);return}const dx=Math.max(-80,Math.min(0,e.clientX-drag.x));if(dx<-6)drag.moved=true;drag.dx=dx;drag.b.style.transform=`translateX(${dx}px)`;const s=drag.b.querySelector('.swi');if(s)s.style.opacity=Math.min(1,-dx/50)});
 function end(cancel){const d=drag;drag=null;if(!d)return null;d.b.classList.remove('drag');d.b.style.transform='';const s=d.b.querySelector('.swi');if(s)s.style.opacity='';return cancel?null:d}
 window.addEventListener('pointerup',()=>{const d=end(false);if(!d)return;
  if(d.dx<-50){setReply(d.id);return}
  if(!d.moved){const now=Date.now();if(last.id===d.id&&now-last.t<320){clearTimeout(tmr);last={id:0,t:0};react(d.id,'👍')}else{last={id:d.id,t:now};tmr=setTimeout(()=>openCtx(d.id),300)}}});
})();
r();
</script>
</body></html>
