<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uncensored Debug — журнал диагностики (предложение)</title><style>
*{box-sizing:border-box}body{margin:0;background:#cfd4db;color:#1b1f24;font:16px/1.5 Roboto,Arial,sans-serif;padding:24px;display:flex;gap:24px;justify-content:center;align-items:flex-start}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #2f7fd1;outline-offset:3px}aside{width:300px;background:white;border-radius:12px;padding:24px}aside h1{font-size:22px;line-height:1.25;margin:0 0 12px}aside p{font-size:14px;color:#52606e}aside button{width:100%;text-align:left;min-height:44px;border:1px solid #d5dbe2;background:#fff;border-radius:8px;margin:4px 0;padding:8px 12px}.phone{width:390px;height:800px;padding:11px;border-radius:40px;background:#0b0b0c;flex:none}.screen{--bg:#fff;--sur:#fff;--hd:#fff;--tx:#1b1f24;--tx2:#596675;--line:#e7eaee;--hover:#f2f4f6;--acc:#2f7fd1;--on:#fff;--pill:#e3effc;background:var(--bg);color:var(--tx);height:100%;border-radius:30px;overflow:hidden;position:relative;display:flex;flex-direction:column}.screen.dark{--bg:#17191d;--sur:#1f2227;--hd:#1f2227;--tx:#eef0f3;--tx2:#a5aeba;--line:#2c3036;--hover:#2a2e34;--acc:#6fb2f2;--on:#0b1a2a;--pill:#24384f}.sb{height:28px;padding:4px 22px;background:var(--hd);display:flex;justify-content:space-between;font-size:12px;flex:none}.header{height:60px;display:flex;align-items:center;background:var(--hd);padding:0 8px;gap:4px;flex:none}.header h2{font-size:21px;margin:0;font-weight:600}.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.ib{width:48px;height:48px;background:none;border:0;color:inherit;display:grid;place-items:center;flex:none}.body{overflow-y:auto;flex:1}.section{padding:16px 16px 6px;color:var(--acc);font-size:14px;font-weight:600}.row{width:100%;border:0;border-bottom:1px solid var(--line);background:var(--sur);color:var(--tx);display:flex;gap:16px;padding:14px 16px;min-height:68px;align-items:center;text-align:left}.row .text{flex:1;min-width:0}.row b{font-size:16px;display:block;font-weight:500}.row small{font-size:14px;color:var(--tx2);display:block;line-height:1.35;margin-top:3px}.pill{font-size:12px;background:var(--pill);color:var(--acc);padding:2px 8px;border-radius:6px}.switch{width:44px;height:26px;flex:none;background:#8a939e;border-radius:16px;position:relative}.switch:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:white;left:3px;top:3px}.switch.on{background:var(--acc)}.switch.on:after{left:21px}.copy{padding:12px 16px;font-size:14px;color:var(--tx2)}.notice{margin:12px 16px;background:var(--hover);border-radius:12px;padding:14px;font-size:14px;color:var(--tx2)}.notice strong{color:var(--tx);display:block;margin-bottom:6px;font-size:16px}.actions{display:flex;gap:10px;flex-direction:column;padding:12px 16px}.btn{min-height:48px;padding:10px 16px;border:0;border-radius:14px;background:var(--acc);color:var(--on);font-weight:600}.btn.secondary{background:var(--hover);color:var(--acc)}.btn:disabled{opacity:.5;cursor:default}.preview{margin:0 16px;background:var(--hover);border-radius:10px;padding:12px;font:13px/1.5 Consolas,monospace;overflow-wrap:anywhere;white-space:pre-wrap}.nav{display:flex;height:76px;border-top:1px solid var(--line);background:var(--sur);flex:none}.nav button{border:0;background:none;color:var(--tx2);width:33.33%;font-size:12px;display:grid;justify-items:center;align-content:center;gap:3px}.nav button.active{color:var(--acc)}.nav .active svg{background:var(--pill);border-radius:10px;width:48px;padding:2px}.home{height:20px;display:grid;place-items:center;flex:none;background:var(--sur)}.home span{width:110px;height:4px;background:var(--tx);border-radius:2px}.scrim{position:absolute;inset:0;background:#0007;display:flex;align-items:flex-end}.sheet{background:var(--sur);padding:24px 16px 28px;width:100%;border-radius:24px 24px 0 0}.sheet h3{margin:0 0 10px;font-size:21px}.sheet p{font-size:14px;color:var(--tx2)}.sheet .btn{width:100%;margin-top:8px}.status{padding:12px 16px;font-size:14px;color:var(--acc)}.avatar{background:#65aadd;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:white;font-size:20px}.about{padding:16px;font-size:14px;color:var(--tx2)}@media(max-width:760px){body{padding:0;background:#fff;display:block}aside{width:auto;border-radius:0;padding:16px}aside h1{font-size:18px}aside p{margin:6px 0}aside .scenarios{display:flex;flex-wrap:wrap;gap:6px}aside button{width:auto;margin:0;font-size:14px}.phone{width:100%;height:800px;padding:0;border-radius:0}.screen{border-radius:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><aside><h1>Debug-логи</h1><p>Предложение · ADR-150<br>Только тестовая сборка. Основа — ui-v14; предложение о звонках ui-v15 не меняется.</p><p>Макет не подключён к приложению. События ниже — вымышленные примеры.</p><div class="scenarios"><button onclick="page='settings';render()">Настройки</button><button onclick="scenario('logs')">Журнал с событиями</button><button onclick="scenario('empty')">Сбор выключен</button><button onclick="scenario('error')">Ошибка сохранения</button><button onclick="dark=!dark;render()">Сменить тему</button></div><p>На телефонах: включить сбор на обоих устройствах, повторить сбой, сохранить по файлу с каждого.</p></aside><div class="phone"><main id="screen" class="screen"></main></div><script>
const icons={back:'<path d="m15 5-7 7 7 7"/>',chev:'<path d="m9 6 6 6-6 6"/>',file:'<path d="M14 2H6v20h12V6zM14 2v4h4M9 12h6M9 16h6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',settings:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/>',chats:'<path d="M3 4h18v13H8l-5 4z"/>',net:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18 5-5 5-13 0-18"/>',bell:'<path d="M6 9a6 6 0 0 1 12 0v7l2 2H4l2-2zM10 21h4"/>',shield:'<path d="m12 2 8 3v6c0 5-4 8-8 11-4-3-8-6-8-11V5z"/>',bt:'<path d="m7 6 10 12-5 4V2l5 4L7 18"/>',palette:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="9" r="1"/><circle cx="15" cy="8" r="1"/>'};
function ic(k){return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+icons[k]+'</svg>'}
const q=new URLSearchParams(location.search);let page=q.get('view')==='settings'?'settings':'logs',dark=q.get('theme')==='dark',collect=q.get('view')!=='empty',count=q.get('view')==='empty'?0:84,notice=q.get('view')==='error'?'Файл не сохранён. Журнал остался на телефоне. Попробуйте ещё раз.':'',sheet=null;
function scenario(k){page='logs';sheet=null;collect=k!=='empty';count=k==='empty'?0:84;notice=k==='error'?'Файл не сохранён. Журнал остался на телефоне. Попробуйте ещё раз.':'';render()}
function row(i,title,sub,action,tail=''){return '<button class="row" onclick="'+action+'">'+ic(i)+'<span class="text"><b>'+title+'</b><small>'+sub+'</small></span>'+tail+'</button>'}
function render(){const s=document.getElementById('screen');s.className='screen'+(dark?' dark':'');let h='<div class="sb"><span>12:45</span><span>78%</span></div><header class="header">'+(page==='logs'?'<button class="ib" aria-label="Назад" onclick="page=\'settings\';render()">'+ic('back')+'</button>':'<span style="width:8px"></span>')+'<h2>'+(page==='logs'?'Debug-логи':'Настройки')+'</h2></header><div class="body">';
if(notice)h+='<div role="status" class="status">'+notice+'</div>';
if(page==='settings'){h+='<div class="row"><span class="avatar">Я</span><span class="text"><b>Вы</b><small>Профиль и ключ · без телефона и почты</small></span></div><div class="section">Связь</div>'+row('shield','Кто что видит','что знают посредники','notice=\'Это макет только debug-логов\';render()',ic('chev'))+row('net','Узел','Запись узла принята','notice=\'Это макет только debug-логов\';render()',ic('chev'))+row('bt','Bluetooth рядом','Выключено','notice=\'Это макет только debug-логов\';render()',ic('chev'))+'<div class="section">Приложение</div>'+row('bell','Уведомления','Имя и текст · без Google','notice=\'Это макет только debug-логов\';render()',ic('chev'))+row('palette','Оформление','тема как в системе','dark=!dark;render()',ic('chev'))+row('file','Debug-логи','Ссылки, связь и доставка','page=\'logs\';notice=\'\';render()','<span class="pill">debug</span>')+'<div class="section">О приложении</div><div class="about">Uncensored Debug 0.0.1-alpha<br>Номер сборки и SHA — в выгруженном файле.</div><div class="copy">Для краткости показаны только соседние пункты настроек. В приложении остальные пункты остаются.</div>'}
else{h+='<div class="copy">Журнал для разбора ошибок добавления контактов и обмена сообщениями.</div>'+row('file','Собирать события',collect?'Включено · только на этом телефоне':'Выключено · новые события не пишутся','collect=!collect;render()','<span role="switch" aria-checked="'+collect+'" class="switch '+(collect?'on':'')+'"></span>')+'<div class="notice"><strong>Без содержимого переписки</strong>Не записываем имена, ключи, адреса узла, пропуски, ссылки и коды. Только этапы операций, время и коды ошибок.</div><div class="section">На этом телефоне</div><div class="copy">'+(count?count+' события · пример: 12 КБ<br>Не больше 2 000 событий / 1 МиБ / 48 часов.':'Журнал пуст. Включите сбор и повторите ошибку.')+'</div>'+(count?'<pre class="preview">+00:02 invite.open.start\n+00:03 relay.guest.ok\n+00:04 relay.new.rejected\n+00:04 invite.open.failed</pre>':'')+'<div class="actions"><button class="btn" '+(!count?'disabled':'')+' onclick="sheet=\'save\';render()">Сохранить файл</button><button class="btn secondary" '+(!count?'disabled':'')+' onclick="sheet=\'clear\';render()">Очистить журнал</button></div><div class="copy">Сбор переживает перезапуск. Журнал хранится зашифрованным внутри приложения; на сервер не отправляется.</div>'}
h+='</div>';if(page==='settings')h+='<nav class="nav"><button>'+ic('chats')+'Чаты</button><button>'+ic('net')+'Связь</button><button class="active">'+ic('settings')+'Настройки</button></nav>';h+='<div class="home"><span></span></div>';
if(sheet==='save')h+='<div class="scrim"><section class="sheet" role="dialog" aria-modal="true" aria-label="Сохранить debug-логи"><h3>Сохранить debug-логи?</h3><p>Файл содержит время и технические события. После сохранения он не зашифрован и хранится вне приложения. Отправляйте его только тому, кому доверяете.</p><p>Далее откроется выбор папки Android. Автоматической отправки нет.</p><button class="btn" onclick="sheet=null;notice=\'Макет: выбор папки Android. В приложении файл появится только после успешной записи.\';render()">Выбрать место</button><button class="btn secondary" onclick="sheet=null;render()">Отмена</button></section></div>';
if(sheet==='clear')h+='<div class="scrim"><section class="sheet" role="dialog" aria-modal="true" aria-label="Очистить журнал"><h3>Очистить журнал?</h3><p>События исчезнут с этого телефона. Уже сохранённые файлы останутся. Настройка сбора не изменится.</p><button class="btn" onclick="count=0;sheet=null;notice=\'Журнал очищен\';render()">Очистить</button><button class="btn secondary" onclick="sheet=null;render()">Отмена</button></section></div>';s.innerHTML=h}
render();
</script></body></html>
