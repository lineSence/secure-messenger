.tr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.tr:last-child{border:0}

.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.types div{padding:10px;border-radius:12px;font-size:13px;background:color-mix(in srgb,var(--c) 13%,var(--sur));display:flex;gap:8px;align-items:center}
.types svg{color:var(--c)}
.srow{display:flex;align-items:center;gap:16px;padding:0 16px;min-height:60px;cursor:pointer;background:var(--sur)}
.srow:hover{background:var(--hov)}.srow .ic{color:var(--tx2)}.srow .rt b{display:block;font-weight:500}.srow .rt span{color:var(--tx2);font-size:13px}
.srow .chev{color:var(--tx2)}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;cursor:pointer;border:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:.2s;box-shadow:0 1px 3px #0004}
.sw.on{background:var(--acc)}.sw.on:after{left:21px}
.scrim{position:absolute;inset:0;background:#0007;z-index:8;display:flex}
.sheet{margin-top:auto;background:var(--sur);width:100%;border-radius:24px 24px 0 0;padding:8px 0 16px}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.drawer{width:300px;background:var(--sur);height:100%;display:flex;flex-direction:column}
.drawer .dh{background:var(--hd);color:var(--hdt);padding:44px 18px 16px}
.drawer .dh b{display:block;font-size:16px;margin-top:10px}.drawer .dh span{font-size:13px;opacity:.8}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#2b2f35;color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:20;white-space:nowrap;box-shadow:0 4px 12px #0004}
.center{text-align:center;padding:16px 20px}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.prog div{height:100%;background:var(--acc);transition:width .3s}
.inp{width:100%;height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:14px;font-family:inherit}
select.inp{height:40px}
.hint{font-size:12px;color:#5b6470;margin-top:4px}
</style>
</head>

 const verified=id==='anya'?S.anyaV:id==='misha'?S.mishaV:true;
 const sub=c.grp?'4 участника · 6 устройств':(verified?'ключ сверен':'ключ не сверен');
 let s=hdr(c.name,{back:true,avatar:av(c,40),sub,right:`<button class="ib" onclick="go('info:${id}')" aria-label="Сведения">${ic('more')}</button>`});

 if(id==='misha'&&!S.mishaV){return s+`<div class="body chatbg"><div class="card" style="--c:var(--badc);border:2px solid var(--badc)"><div style="display:flex;gap:10px;align-items:center;color:var(--badc)">${ic('alert')}<h3 style="color:var(--badc);margin:0">Ключ безопасности изменился</h3></div><p class="muted">Так бывает при новом телефоне или переустановке — но так же выглядит подмена. Отправка Мише остановлена, пока вы не сверите код лично или голосом по другому каналу.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="go('verify:misha')">${ic('shield','s')}Сверить код</button><button class="btn sec" onclick="toast('Отправка остаётся заблокированной')">Позже</button></div></div><div class="msgs"><div class="day">Вчера</div><div class="m in tail">Завтра в 10 у станции<span class="meta">21:10</span></div><div class="day">Ключ изменился · 22:47</div><div class="m in tail">Привет, это я, новый телефон<span class="meta">22:48 · не проверено</span></div></div></div><div class="comp"><input disabled placeholder="Отправка заблокирована до сверки"><button class="ib" disabled style="opacity:.4">${ic('lock')}</button></div>`}
 if(id==='anya'&&!S.anyaV)s+=`<div class="banner warn">${ic('shield')}<span class="grow">Контакт добавлен по ссылке и ещё не сверен</span><button class="btn sm" onclick="go('verify:anya')">Сверить</button></div>`;
 s+=`<div class="body chatbg" id="cb"><div class="msgs" id="msgs">`;
 const ms=MSG[id];let tm=20;
 ms.forEach((m,i)=>{const nx=ms[i+1],tail=!nx||nx[0]!==m[0];tm+=3;
  if(m[0]==='d'){s+=`<div class="day">${m[1]}</div>`;return}
  const big=/^\p{Extended_Pictographic}+$/u.test(m[1].replace(/\s|\uFE0F/g,''));
  if(m[0]==='me')s+=`<div class="m me ${tail?'tail':''} ${big?'big':''}">${m[1]}<span class="meta">12:${tm} · ${n.short} ${ic('check2','xs')}</span></div>`;
  else s+=`<div class="m in ${tail?'tail':''} ${big?'big':''}">${c.grp&&!big?`<span class="who">${m[0]}</span>`:''}${m[1]}<span class="meta">12:${tm}</span></div>`});
 s+=`</div></div>`;
 if(S.net!=='ok')s+=`<div class="banner ${n.k}">${ic(S.net==='warn'?'warn':'radio')}<span class="grow">${S.net==='warn'?'Запасной путь: сообщения идут медленнее':'Только LoRa: до ~200 символов, доставка — минуты'}</span></div>`;
 s+=`<div class="comp"><button class="ib" onclick="S.picker=!S.picker;r()" aria-label="Эмодзи">${ic(S.picker?'keyboard':'smile')}</button><input id="inp" placeholder="Сообщение" onkeydown="if(event.key==='Enter')sendMsg('${id}')"><button class="ib" onclick="toast('Вложения — в следующих версиях')" aria-label="Вложение">${ic('attach')}</button><button class="ib send" onclick="sendMsg('${id}')" aria-label="Отправить">${ic('send')}</button></div>`;
 if(S.picker)s+=`<div class="picker">${EMO.map(e=>`<button onclick="addEmo('${e}')">${e}</button>`).join('')}</div>`;
 return s}
function addEmo(e){const i=document.getElementById('inp');i.value+=e;i.focus()}
function sendMsg(id){const i=document.getElementById('inp');if(!i||!i.value.trim())return;const v=i.value.trim();i.value='';
 const n=NET[S.net];const d=document.createElement('div');const big=/^\p{Extended_Pictographic}+$/u.test(v.replace(/\s|\uFE0F/g,''));
 d.className='m me tail'+(big?' big':'');d.innerHTML=`${v.replace(/</g,'&lt;')}<span class="meta">12:45 · в очереди ${ic('clock','xs')}</span>`;
 document.getElementById('msgs').appendChild(d);const cb=document.getElementById('cb');cb.scrollTop=cb.scrollHeight;
 MSG[id].push(['me',v]);S.extra[id]=v;
 setTimeout(()=>{d.querySelector('.meta').innerHTML=`12:45 · ${n.short} ${ic('check2','xs')}`},S.net==='ok'?700:S.net==='warn'?2200:4200)}

 if(c.grp)return s+`<div class="muted">4 участника · 6 устройств</div></div><div class="sech">Участники</div>${[['Вы','2 устройства',COL[3]],['Мама','телефон',COL[0]],['Папа','телефон, Windows',COL[2]],['Аня','телефон',COL[7]]].map(([a,b,cl])=>`<div class="row" style="--av:44px;--rowh:60px"><div class="av" style="background:${cl}">${a[0]}</div><div class="rt"><div class="n">${a}</div><div class="l"><span>${b}</span></div></div></div>`).join('')}<div style="padding:12px"><button class="btn sec w" onclick="S.sheet='invite';r()">${ic('userplus','s')}Добавить участника</button></div></div>`;
 const v=id==='anya'?S.anyaV:id==='misha'?S.mishaV:true;
 return s+`<span class="tag ${v?'ok':'warn'}" style="font-size:13px;padding:3px 10px">${ic(v?'shield':'alert','xs')}${v?'Код сверен':'Не сверен'}</span></div><div class="sech">Безопасность</div><div class="srow" onclick="go('verify:${id}')"><span class="ic">${ic('qr')}</span><div class="rt"><b>Код безопасности</b><span>Сверить QR или цифрами</span></div><span class="chev">${ic('chev','s')}</span></div><div class="srow"><span class="ic">${ic('phone')}</span><div class="rt"><b>Устройства контакта</b><span>2: телефон, Windows</span></div></div><div class="srow" onclick="toast('Исчезающие сообщения — в будущих версиях')"><span class="ic">${ic('timer')}</span><div class="rt"><b>Исчезающие сообщения</b><span>Выкл.</span></div></div></div>`}

  s+=`</div><div class="card"><h3>Получили ссылку?</h3><p class="muted">Нажмите на неё — приложение откроется само, или вставьте сюда.</p><input class="inp" placeholder="Вставить ссылку"></div>`}
 return s+`</div>`}
function vDiag(isTab){let s=hdr('Связь',{back:!isTab,menu:isTab&&S.nav==='B',right:`<button class="ib" onclick="runDiag()" aria-label="Проверить">${ic('refresh')}</button>`})+netbar()+`<div class="body">`;
 const st={ok:[['VLESS + XHTTP + Reality','работает · 140 мс','ok'],['Запасной путь 1','работает · 900 мс','ok'],['Запасной путь 2 (белые списки)','работает · медленно','warn'],['LoRa · Heltec V3','подключён · 1 узел рядом','ok']],warn:[['VLESS + XHTTP + Reality','заблокирован','bad'],['Запасной путь 1','заблокирован','bad'],['Запасной путь 2 (белые списки)','работает · 2,1 с','warn'],['LoRa · Heltec V3','подключён · 1 узел рядом','ok']],bad:[['VLESS + XHTTP + Reality','нет сети','bad'],['Запасной путь 1','нет сети','bad'],['Запасной путь 2 (белые списки)','нет сети','bad'],['LoRa · Heltec V3','подключён · 1 узел рядом','ok']]}[S.net];
 const ty={ok:[['text','Текст','работает','ok'],['image','Фото и файлы','позже','ok'],['mic','Голосовые','позже','ok'],['call','Звонки','позже','ok']],warn:[['text','Текст','медленно','warn'],['image','Фото и файлы','нет','bad'],['mic','Голосовые','нет','bad'],['call','Звонки','нет','bad']],bad:[['text','Текст','до ~200 симв.','warn'],['image','Фото и файлы','нет','bad'],['mic','Голосовые','нет','bad'],['call','Звонки','нет','bad']]}[S.net];
 s+=`<div class="card"><h3>Что работает сейчас</h3><div class="muted">${S.diagRun?'Идёт проверка…':'Проверено 2 мин назад'} · проверяются только наши узлы</div>${S.diagRun?`<div class="prog" style="margin-top:10px"><div style="width:${S.diagP}%"></div></div>`:''}<div class="types">${ty.map(([i,a,b,c])=>`<div class="${c}">${ic(i)}<span><b>${a}</b><br>${b}</span></div>`).join('')}</div></div>`;
 s+=`<div class="card"><h3>Каналы</h3>${st.map(([a,b,c])=>`<div class="tr ${c}"><span class="lampc"></span><div class="rt"><b>${a}</b><span>${b}</span></div></div>`).join('')}<div class="muted" style="margin-top:6px">Переключение автоматическое: сообщение уходит по первому работающему каналу.</div></div>`;
 s+=`<div class="card"><h3>Отчёт группе</h3><p class="muted">Результаты уходят участникам по шифрованному каналу — видно, у кого что работает в их регионе.</p><div class="tr"><div class="rt"><b>Автоматически</b><span>при смене состояния связи</span></div><button class="sw ${S.autoRep?'on':''}" onclick="S.autoRep=!S.autoRep;r()" aria-label="Автоотчёт"></button></div><button class="btn ${S.repSent?'sec':''} w" style="margin-top:8px" onclick="S.repSent=true;toast('Отчёт отправлен в «Семья»')">${ic('report','s')}${S.repSent?'Отправлено':'Отправить отчёт сейчас'}</button></div>`;
 s+=`<div class="card"><h3>У участников</h3>${[['Мама','Москва','основной канал','ok'],['Аня','Краснодар','только белые списки','warn'],['Миша','за границей','основной канал','ok']].map(([a,b,c,d])=>`<div class="tr ${d}"><span class="lampc"></span><div class="rt"><b>${a}</b><span>${b} · ${c} · 15 мин назад</span></div></div>`).join('')}</div>${S.nav==='A'&&O.nav==='float'&&isTab?'<div style="height:80px"></div>':''}</div>`;

function vDevices(){return hdr('Мои устройства',{back:true})+`<div class="body"><div class="card"><div class="tr"><span class="ic">${ic('phone')}</span><div class="rt"><b>Этот телефон</b><span>Pixel · основное</span></div></div><div class="tr"><span class="ic">${ic('laptop')}</span><div class="rt"><b>Windows-ПК</b><span>в сети 10 мин назад</span></div><button class="btn sm sec" onclick="toast('Устройство отключено, ключи сменены')">Отключить</button></div></div><div class="card"><h3>Подключить устройство</h3><p class="muted">На новом устройстве выберите «Подключить к существующему» и отсканируйте QR. История переносится в зашифрованном виде с этого телефона.</p><button class="btn w" onclick="go('link')">${ic('qr','s')}Показать QR</button></div></div>`}

function vUpd(){if(S.upd==='done')return hdr('Обновления',{back:true})+`<div class="body center"><h2>0.2.0</h2><span class="tag ok" style="font-size:13px;padding:3px 10px">${ic('check','xs')}Установлена последняя версия</span></div>`;
 return hdr('Обновления',{back:true})+`<div class="body"><div class="card"><h3>Доступна версия 0.2.0</h3><p class="muted">Скачано через ${NET[S.net].ch} · 18 МБ</p><span class="tag ok" style="font-size:13px;padding:3px 10px">${ic('shield','xs')}Подпись релиза верна</span><p>Что нового: проверка связи показывает задержку; исправлен перенос истории.</p><button class="btn w" onclick="S.upd='done';toast('Android попросит подтвердить установку')">${ic('download','s')}Установить</button></div><div class="card muted">Если подпись не совпадёт — установки не будет, приложение покажет предупреждение.</div></div>`}
function vMyKey(){return hdr('Мой ключ',{back:true})+`<div class="body"><div class="qr">${qrSvg(5)}</div><div class="center muted">Ваш идентификатор — это ключ. Телефон и почта не нужны.</div><div class="card code" style="font-size:14px">a3f9 21c7 7e0b 9d44<br>05e1 c2a8 66f3 1b90</div></div>`}

 return `<div class="scrim" ${close}><div class="sheet"><div class="grab"></div>${o}</div></div>`}

 panel()}
function panel(){const v=V[S.v];document.getElementById('panel').innerHTML=`<h2>Макет UI v2 · 10 вариантов</h2><small>Интерактивный макет по правилу [UI-MOCKUP-FIRST]. Данные выдуманы. Эмодзи — только в сообщениях и в панели эмодзи чата; все значки интерфейса — SVG.</small>
<h2>Вариант оформления</h2><div class="vlist">${V.map((x,i)=>`<label><input type="radio" name="v" ${i===S.v?'checked':''} onchange="S.v=${i};r()"><span><b>${x.id}. ${x.name}</b><span>${x.d}</span></span></label>`).join('')}</div>
<div class="why"><b>Почему так:</b> ${v.why}</div>
<h2>Навигация</h2><label><input type="radio" name="nav" ${S.nav==='A'?'checked':''} onchange="S.nav='A';S.stack=[];S.tab='chats';r()"><span><b>А</b> — нижняя панель: Чаты · Связь · Настройки</span></label><label><input type="radio" name="nav" ${S.nav==='B'?'checked':''} onchange="S.nav='B';S.stack=[];r()"><span><b>Б</b> — боковое меню (кнопка слева вверху)</span></label><div class="hint">Для справки: Material 3 Expressive больше не рекомендует боковое меню, а NN/g находит скрытую навигацию хуже видимой. Вариант оставлен по вашему запросу.</div>
<h2>Тема</h2><label><input type="radio" name="th" ${S.theme==='system'?'checked':''} onchange="S.theme='system';r()"><span>Как в системе (сейчас: ${mq.matches?'тёмная':'светлая'})</span></label><label><input type="radio" name="th" ${S.theme==='light'?'checked':''} onchange="S.theme='light';r()"><span>Просмотр: светлая</span></label><label><input type="radio" name="th" ${S.theme==='dark'?'checked':''} onchange="S.theme='dark';r()"><span>Просмотр: тёмная</span></label><div class="hint">В приложении будет только «как в системе»; два последних пункта — для просмотра макета.</div>
<h2>Состояние связи (для показа)</h2>${[['ok','Основной канал работает'],['warn','Только запасной путь (белые списки)'],['bad','Нет интернета, только LoRa']].map(([k,l])=>`<label><input type="radio" name="net" ${S.net===k?'checked':''} onchange="S.net='${k}';r()"><span>${l}</span></label>`).join('')}
<h2>Что попробовать</h2><small>1) Нажмите полосу связи. 2) «Аня» — не сверена. 3) «Миша» — сменился ключ. 4) В чате — кнопка эмодзи слева от поля. 5) Карандаш — новый контакт: QR или ссылка. 6) Настройки: устройства, LoRa, обновления.</small>`}
mq.addEventListener('change',()=>r());
r();
</script>
</body></html>
