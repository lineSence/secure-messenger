[package]
name = "sm-signal"
version = "0.0.1"
description = "Шифрование 1:1 через libsignal (ADR-2, ADR-47, ADR-55)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Проверка текста из сети (`wire::text`) — та же, что у сообщений (ревью v0.0.1-alpha, п.11).
sm-core = { path = "../sm-core", version = "=0.0.1" }
# ADR-47, ADR-55: только из репозитория Signal — тег v0.105.0 = коммит 4beb029d (cargo не даёт указать tag и rev вместе).
libsignal-protocol = { version = "=0.1.0", git = "https://github.com/signalapp/libsignal", rev = "4beb029d8a941f81e7d9c6d8af1ed25a677569a8" }
# HMAC-SHA256 для меток поиска BLE (ADR-61) — крейт того же репозитория и коммита.
signal-crypto = { version = "=0.1.0", git = "https://github.com/signalapp/libsignal", rev = "4beb029d8a941f81e7d9c6d8af1ed25a677569a8" }
# Та же версия, что у libsignal-protocol; только системный генератор (OsRng).
rand = { version = "=0.9.4", default-features = false, features = ["os_rng", "std"] }
# Свои хранилища синхронные: будущее libsignal готово сразу (now_or_never), исполнитель не нужен.
futures-util = { version = "=0.3.32", default-features = false }
# Трейты хранилищ libsignal объявлены через async-trait — та же версия, что в графе libsignal.
async-trait = "=0.1.92"
