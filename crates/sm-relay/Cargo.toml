[package]
name = "sm-relay"
version = "0.0.1"
description = "Узел-реле: очереди зашифрованных блобов в памяти, TTL, без логов (шаг 2)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sm-core = { path = "../sm-core", version = "=0.0.1" }
# Проверка подписи пропуска (ADR-136): XEdDSA из libsignal без протокольной части.
libsignal-core = { version = "=0.1.0", git = "https://github.com/signalapp/libsignal", rev = "4beb029d8a941f81e7d9c6d8af1ed25a677569a8" }
# SHA-256 для ID отправителя (ADR-134) — через обёртку libsignal, не примитивом (ADR-1).
signal-crypto = { version = "=0.1.0", git = "https://github.com/signalapp/libsignal", rev = "4beb029d8a941f81e7d9c6d8af1ed25a677569a8" }
# Случайные ID билетов и гостевых пропусков, случайность подписи (ADR-146): только `OsRng`.
rand = { version = "=0.9.4", default-features = false, features = ["os_rng", "std"] }

# Safe readiness API; no default logging feature. Audits imported from existing trusted sources.
mio = { version = "=1.2.4", default-features = false, features = ["net", "os-poll"] }
