# Свои правила Semgrep (ADR-1, ADR-15, ADR-20). Запуск: semgrep scan --config .semgrep/ --error
rules:
  - id: sm-no-own-crypto
    languages: [rust]
    severity: ERROR
    message: >-
      ADR-1: свою криптографию не пишем. Примитивы (AES, ChaCha, SHA, HMAC, Curve25519, RSA, ring)
      напрямую не используем — только через libsignal и OpenMLS. Исключение — через ADR.
    # use / extern crate / полный путь (aes_gcm::...).
    pattern-regex: '\b(?:(?:use|extern\s+crate)\s+(?:::)?(?:aes|aes_gcm|aes_gcm_siv|chacha20|chacha20poly1305|xsalsa20poly1305|sha1|sha2|sha3|hmac|hkdf|pbkdf2|argon2|ring|rsa|ed25519_dalek|x25519_dalek|curve25519_dalek|blake2|blake3|poly1305|libcrux|aws_lc_rs|p256|k256)\b|(?:aes|aes_gcm|aes_gcm_siv|chacha20|chacha20poly1305|xsalsa20poly1305|sha1|sha2|sha3|hmac|hkdf|pbkdf2|argon2|ring|rsa|ed25519_dalek|x25519_dalek|curve25519_dalek|blake2|blake3|poly1305|libcrux|aws_lc_rs|p256|k256)::)'

  - id: sm-no-weak-rng
    languages: [rust]
    severity: ERROR
    message: >-
      Небезопасный или детерминированный генератор случайных чисел. Для ключей и нонсов —
      только OsRng / getrandom или то, что делает libsignal/OpenMLS.
    pattern-regex: '\b(thread_rng|SmallRng|seed_from_u64|rand::random)\b'
    paths:
      exclude: ["**/tests/**", "fuzz/**"]

  - id: sm-slice-with-header-length
    languages: [rust]
    severity: ERROR
    message: >-
      Срез по длине из данных (buf[a..a + len]) паникует или читает чужие данные при враждебной длине.
      Используйте .get(..) / split_at_checked и проверку переполнения.
    pattern-either:
      - pattern: $BUF[$A..$A + $LEN]
      - pattern: $BUF[..$LEN as usize]
      - pattern: $BUF[$A..$LEN as usize]

  - id: sm-no-process-spawn
    languages: [rust]
    severity: ERROR
    message: Запуск внешних процессов из ядра запрещён (поверхность атаки, утечки данных).
    pattern-either:
      - pattern: std::process::Command::new(...)
      - pattern: Command::new(...)
    paths:
      include: ["crates/**"]

  - id: sm-no-plain-http
    languages: [rust]
    severity: ERROR
    message: Нешифрованный http:// в коде. Весь сетевой обмен — через транспорты с TLS/Reality.
    pattern-regex: '"http://(?!localhost|127\.0\.0\.1)'
    paths:
      exclude: ["**/tests/**"]

  - id: sm-no-secret-in-debug
    languages: [rust]
    severity: WARNING
    message: Похоже, в лог или Debug попадает ключ/секрет. Ключи не логируем никогда.
    pattern-regex: '(?i)(println|eprintln|log::\w+|tracing::\w+|info|debug|warn|error|trace)!\([^;]*\b(secret|private_key|priv_key|seed|password|passphrase)\b'

  - id: sm-no-crypto-dependency
    languages: [generic]
    severity: ERROR
    message: >-
      ADR-1: криптографический примитив подключён напрямую в нашем Cargo.toml (в том числе через package = "...").
      Примитивы — только внутри libsignal / OpenMLS. Исключение — через ADR.
    # Формы TOML: имя =, имя.<ключ> =, [*dependencies.имя], *dependencies.имя =, package = "имя".
    pattern-regex: '(?m)(?:^\s*["'']?(?:aes|aes[-_]gcm|aes[-_]gcm[-_]siv|chacha20|chacha20poly1305|xsalsa20poly1305|sha1|sha2|sha3|hmac|hkdf|pbkdf2|argon2|ring|rsa|ed25519[-_]dalek|x25519[-_]dalek|curve25519[-_]dalek|blake2|blake3|poly1305|libcrux|aws[-_]lc[-_]rs|p256|k256)["'']?\s*(?:\.\s*[A-Za-z0-9_-]+\s*)*=|^[^\n#]*dependencies["'']?\s*\.\s*["'']?(?:aes|aes[-_]gcm|aes[-_]gcm[-_]siv|chacha20|chacha20poly1305|xsalsa20poly1305|sha1|sha2|sha3|hmac|hkdf|pbkdf2|argon2|ring|rsa|ed25519[-_]dalek|x25519[-_]dalek|curve25519[-_]dalek|blake2|blake3|poly1305|libcrux|aws[-_]lc[-_]rs|p256|k256)["'']?\s*[.=\]]|package\s*=\s*["''](?:aes|aes[-_]gcm|aes[-_]gcm[-_]siv|chacha20|chacha20poly1305|xsalsa20poly1305|sha1|sha2|sha3|hmac|hkdf|pbkdf2|argon2|ring|rsa|ed25519[-_]dalek|x25519[-_]dalek|curve25519[-_]dalek|blake2|blake3|poly1305|libcrux|aws[-_]lc[-_]rs|p256|k256)["''])'
    paths:
      include: ["Cargo.toml", "crates/**/Cargo.toml", "fuzz/Cargo.toml"]
