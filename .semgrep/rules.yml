# Свои правила Semgrep (ADR-1, ADR-15, ADR-20). Запуск: semgrep scan --config .semgrep/ --error
rules:
  - id: sm-no-own-crypto
    languages: [rust]
    severity: ERROR
    message: >-
      ADR-1: свою криптографию не пишем. Примитивы (AES, ChaCha, SHA, HMAC, Curve25519, RSA, ring)
      напрямую не используем — только через libsignal и OpenMLS. Исключение — через ADR.
    # use / extern crate / полный путь (aes_gcm::...). Список крейтов — тот же, что в deny.toml [bans].deny.
    pattern-regex: '\b(?:(?:use|extern\s+crate)\s+(?:::)?(?:aead|aes|aes_gcm|aes_gcm_siv|aes_kw|aes_siv|argon2|aws_lc_rs|aws_lc_sys|bcrypt|blake2|blake3|boring|boring_sys|botan|cbc|ccm|chacha20|chacha20poly1305|cipher|crypto_box|crypto_common|crypto_secretbox|ctr|curve25519_dalek|curve25519_dalek_ng|des|digest|dsa|eax|ecdsa|ed25519|ed25519_dalek|ed25519_dalek_ng|ed25519_zebra|ed448_goldilocks|elliptic_curve|hkdf|hmac|k256|keccak|kuznyechik|libcrux|libsodium_sys|magma|md5|md_5|ml_dsa|ml_kem|openssl|openssl_sys|orion|p224|p256|p384|p521|pbkdf2|poly1305|pqcrypto_internals|pqcrypto_traits|rc4|ring|ripemd|rsa|rust_crypto|salsa20|scrypt|secp256k1|sha1|sha2|sha3|sha_1|signature|slh_dsa|sm4|sodiumoxide|streebog|universal_hash|x25519_dalek|x25519_dalek_ng|x448|xsalsa20poly1305)\b|(?:aead|aes|aes_gcm|aes_gcm_siv|aes_kw|aes_siv|argon2|aws_lc_rs|aws_lc_sys|bcrypt|blake2|blake3|boring|boring_sys|botan|cbc|ccm|chacha20|chacha20poly1305|cipher|crypto_box|crypto_common|crypto_secretbox|ctr|curve25519_dalek|curve25519_dalek_ng|des|digest|dsa|eax|ecdsa|ed25519|ed25519_dalek|ed25519_dalek_ng|ed25519_zebra|ed448_goldilocks|elliptic_curve|hkdf|hmac|k256|keccak|kuznyechik|libcrux|libsodium_sys|magma|md5|md_5|ml_dsa|ml_kem|openssl|openssl_sys|orion|p224|p256|p384|p521|pbkdf2|poly1305|pqcrypto_internals|pqcrypto_traits|rc4|ring|ripemd|rsa|rust_crypto|salsa20|scrypt|secp256k1|sha1|sha2|sha3|sha_1|signature|slh_dsa|sm4|sodiumoxide|streebog|universal_hash|x25519_dalek|x25519_dalek_ng|x448|xsalsa20poly1305)::)'

  - id: sm-no-weak-rng
    languages: [rust]
    severity: ERROR
    message: >-
      Небезопасный или детерминированный генератор случайных чисел. Для ключей и нонсов —
      только OsRng / getrandom или то, что делает libsignal/OpenMLS.
    pattern-regex: '\b(thread_rng|SmallRng|seed_from_u64|rand::random)\b'
    paths:
      exclude: ["**/tests/**", "fuzz/**"]

  - id: sm-slice-with-header-length
    languages: [rust]
    severity: ERROR
    message: >-
      Срез по длине из данных (buf[a..a + len]) паникует или читает чужие данные при враждебной длине.
      Используйте .get(..) / split_at_checked и проверку переполнения.
    pattern-either:
      - pattern: $BUF[$A..$A + $LEN]
      - pattern: $BUF[..$LEN as usize]
      - pattern: $BUF[$A..$LEN as usize]

  - id: sm-no-process-spawn
    languages: [rust]
    severity: ERROR
    message: Запуск внешних процессов из ядра запрещён (поверхность атаки, утечки данных).
    pattern-either:
      - pattern: std::process::Command::new(...)
      - pattern: Command::new(...)
    paths:
      include: ["crates/**"]

  - id: sm-no-plain-http
    languages: [rust]
    severity: ERROR
    message: Нешифрованный http:// в коде. Весь сетевой обмен — через транспорты с TLS/Reality.
    pattern-regex: '"http://(?!localhost|127\.0\.0\.1)'
    paths:
      exclude: ["**/tests/**"]

  - id: sm-no-secret-in-debug
    languages: [rust]
    severity: WARNING
    message: Похоже, в лог или Debug попадает ключ/секрет. Ключи не логируем никогда.
    pattern-regex: '(?i)(println|eprintln|log::\w+|tracing::\w+|info|debug|warn|error|trace)!\([^;]*\b(secret|private_key|priv_key|seed|password|passphrase)\b'

  - id: sm-no-crypto-dependency
    languages: [generic]
    severity: ERROR
    message: >-
      ADR-1: криптографический примитив подключён напрямую в нашем Cargo.toml (в том числе через package = "...").
      Примитивы — только внутри libsignal / OpenMLS. Исключение — через ADR.
    # Формы TOML: имя =, имя.<ключ> =, [*dependencies.имя], *dependencies.имя =, *dependencies = { …, имя = … },
    # package = "имя" (имена в кавычках тоже). Список — тот же, что в deny.toml; сверка — scripts/check-crypto-bans.mjs.
    # Это быстрая подсказка; надёжная проверка — cargo deny [bans].deny по реальному графу зависимостей.
    pattern-regex: '(?m)(?:^\s*["'']?(?:aead|aes|aes[-_]gcm|aes[-_]gcm[-_]siv|aes[-_]kw|aes[-_]siv|argon2|aws[-_]lc[-_]rs|aws[-_]lc[-_]sys|bcrypt|blake2|blake3|boring|boring[-_]sys|botan|cbc|ccm|chacha20|chacha20poly1305|cipher|crypto[-_]common|crypto_box|crypto_secretbox|ctr|curve25519[-_]dalek|curve25519[-_]dalek[-_]ng|des|digest|dsa|eax|ecdsa|ed25519|ed25519[-_]dalek|ed25519[-_]dalek[-_]ng|ed25519[-_]zebra|ed448[-_]goldilocks|elliptic[-_]curve|hkdf|hmac|k256|keccak|kuznyechik|libcrux|libsodium[-_]sys|magma|md[-_]5|md5|ml[-_]dsa|ml[-_]kem|openssl|openssl[-_]sys|orion|p224|p256|p384|p521|pbkdf2|poly1305|pqcrypto[-_]internals|pqcrypto[-_]traits|rc4|ring|ripemd|rsa|rust[-_]crypto|salsa20|scrypt|secp256k1|sha[-_]1|sha1|sha2|sha3|signature|slh[-_]dsa|sm4|sodiumoxide|streebog|universal[-_]hash|x25519[-_]dalek|x25519[-_]dalek[-_]ng|x448|xsalsa20poly1305)["'']?\s*(?:\.\s*["'']?[A-Za-z0-9_-]+["'']?\s*)*=|^[^\n#]*dependencies["'']?\s*\.\s*["'']?(?:aead|aes|aes[-_]gcm|aes[-_]gcm[-_]siv|aes[-_]kw|aes[-_]siv|argon2|aws[-_]lc[-_]rs|aws[-_]lc[-_]sys|bcrypt|blake2|blake3|boring|boring[-_]sys|botan|cbc|ccm|chacha20|chacha20poly1305|cipher|crypto[-_]common|crypto_box|crypto_secretbox|ctr|curve25519[-_]dalek|curve25519[-_]dalek[-_]ng|des|digest|dsa|eax|ecdsa|ed25519|ed25519[-_]dalek|ed25519[-_]dalek[-_]ng|ed25519[-_]zebra|ed448[-_]goldilocks|elliptic[-_]curve|hkdf|hmac|k256|keccak|kuznyechik|libcrux|libsodium[-_]sys|magma|md[-_]5|md5|ml[-_]dsa|ml[-_]kem|openssl|openssl[-_]sys|orion|p224|p256|p384|p521|pbkdf2|poly1305|pqcrypto[-_]internals|pqcrypto[-_]traits|rc4|ring|ripemd|rsa|rust[-_]crypto|salsa20|scrypt|secp256k1|sha[-_]1|sha1|sha2|sha3|signature|slh[-_]dsa|sm4|sodiumoxide|streebog|universal[-_]hash|x25519[-_]dalek|x25519[-_]dalek[-_]ng|x448|xsalsa20poly1305)["'']?\s*[.=\]]|^[^\n#]*dependencies["'']?\s*=\s*\{(?:[^\n]*?[{,])?\s*["'']?(?:aead|aes|aes[-_]gcm|aes[-_]gcm[-_]siv|aes[-_]kw|aes[-_]siv|argon2|aws[-_]lc[-_]rs|aws[-_]lc[-_]sys|bcrypt|blake2|blake3|boring|boring[-_]sys|botan|cbc|ccm|chacha20|chacha20poly1305|cipher|crypto[-_]common|crypto_box|crypto_secretbox|ctr|curve25519[-_]dalek|curve25519[-_]dalek[-_]ng|des|digest|dsa|eax|ecdsa|ed25519|ed25519[-_]dalek|ed25519[-_]dalek[-_]ng|ed25519[-_]zebra|ed448[-_]goldilocks|elliptic[-_]curve|hkdf|hmac|k256|keccak|kuznyechik|libcrux|libsodium[-_]sys|magma|md[-_]5|md5|ml[-_]dsa|ml[-_]kem|openssl|openssl[-_]sys|orion|p224|p256|p384|p521|pbkdf2|poly1305|pqcrypto[-_]internals|pqcrypto[-_]traits|rc4|ring|ripemd|rsa|rust[-_]crypto|salsa20|scrypt|secp256k1|sha[-_]1|sha1|sha2|sha3|signature|slh[-_]dsa|sm4|sodiumoxide|streebog|universal[-_]hash|x25519[-_]dalek|x25519[-_]dalek[-_]ng|x448|xsalsa20poly1305)["'']?\s*[.=]|package\s*=\s*["''](?:aead|aes|aes[-_]gcm|aes[-_]gcm[-_]siv|aes[-_]kw|aes[-_]siv|argon2|aws[-_]lc[-_]rs|aws[-_]lc[-_]sys|bcrypt|blake2|blake3|boring|boring[-_]sys|botan|cbc|ccm|chacha20|chacha20poly1305|cipher|crypto[-_]common|crypto_box|crypto_secretbox|ctr|curve25519[-_]dalek|curve25519[-_]dalek[-_]ng|des|digest|dsa|eax|ecdsa|ed25519|ed25519[-_]dalek|ed25519[-_]dalek[-_]ng|ed25519[-_]zebra|ed448[-_]goldilocks|elliptic[-_]curve|hkdf|hmac|k256|keccak|kuznyechik|libcrux|libsodium[-_]sys|magma|md[-_]5|md5|ml[-_]dsa|ml[-_]kem|openssl|openssl[-_]sys|orion|p224|p256|p384|p521|pbkdf2|poly1305|pqcrypto[-_]internals|pqcrypto[-_]traits|rc4|ring|ripemd|rsa|rust[-_]crypto|salsa20|scrypt|secp256k1|sha[-_]1|sha1|sha2|sha3|signature|slh[-_]dsa|sm4|sodiumoxide|streebog|universal[-_]hash|x25519[-_]dalek|x25519[-_]dalek[-_]ng|x448|xsalsa20poly1305)["''])'
    paths:
      include: ["**/Cargo.toml"]

  - id: sm-no-toml-escapes
    languages: [generic]
    severity: ERROR
    message: >-
      В Cargo.toml запрещены \u/\U-экранирование и тройные кавычки: ими можно спрятать имя крейта от проверок
      (например, "sha\u0032" = sha2). Пишите имена и строки обычным текстом.
    pattern-regex: '\\[uU]|"""|'''''''
    paths:
      include: ["**/Cargo.toml"]
